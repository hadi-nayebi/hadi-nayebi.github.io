      The Triangle Collapses to Two
  - id: s08
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "b1d773987fe2"   # curated source block; drift -> review
    text_hash: "b1d773987fe2"     # narration; change -> re-render
    text: |-
      This is what changes when the design principles themselves are teachable. The agent-developer-user triangle most software defaults to — where one role builds, another configures, a third uses — collapses to two: the agent and you. The patterns are legible enough that the user can direct the architecture of a distinct living system. Call it the PowerPoint of seed agents: a complex artifact made authorable by enough high-level structural understanding, without anyone having to write all of the underlying machinery.
  - id: s09
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "3106ac6a5873"   # curated source block; drift -> review
    text_hash: "3106ac6a5873"     # narration; change -> re-render
    text: |-
      Essay 5.1 gave you a substrate pattern. Essay 6.1 gave you a cognitive-cycle pattern. Essay 7.1 gave you a way to grow plugins. This essay closes the loop: the maturation arc that takes a stage-1 conversation into a stage-4 plugin is what makes your seed yours. The writings provide the design context; you and your agent assemble the architecture.
