    text_hash: "909cdb80fdf2"     # narration; change -> re-render
    text: |-
      The Hadosh Academy seed work is an open, inspectable body of technical writing and public pattern-accumulation surfaces. The writings carry the concepts, design principles, and building-block context across tasks and frameworks. Seed Agent and Q-Seed provide distinct framework-specific places where selected foundations can accumulate through public use, discussion, issues, and pull requests. Their sparseness is intentional: an agent may consult them, adapt one component, or build entirely from the writings. The promise behind the work remains the same: no SaaS layer between you and your harness, no remote server required to hold your knowledge directory, and no company owning the system that learns how you work.
  - id: s05
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "8fd679b1ead7"   # curated source block; drift -> review
    text_hash: "8fd679b1ead7"     # narration; change -> re-render
    text: |-
      When you and your agent build a seed in a local space you control, it becomes yours. The principles are the principles I have described across this series. But the architecture, cycles, and software are shaped by your work. The patterns it codifies, the voices it speaks, the hooks it hardens — they will be the patterns your work surfaces, the voices your judgment shapes, the hooks your edge cases call into existence. Your first jobs will be stage 1 — collaborative, learning-mode, slow on purpose. Some of those jobs will mature into stage 2, then stage 3, and a few — for the work shapes that need real customization — into stage 4 plugins that exist nowhere else but in your seed.
  - id: s06
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "800e7b5c43e6"   # curated source block; drift -> review
    text_hash: "800e7b5c43e6"     # narration; change -> re-render
    text: |-
      Two operators with two seeds, six months in, will have brains that are visibly different — not only different contents inside identical software, but different structures, plugins, and adaptations. They may share a few proven building blocks. They do not need to converge. That is the design.
