      The Academy Exists Because Craft Benefits From Community
  - id: s11
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "94db7836957a"   # curated source block; drift -> review
    text_hash: "94db7836957a"     # narration; change -> re-render
    text: |-
      The Academy exists because growing a seed well is a craft, and craft benefits from community. Other operators are growing their own seeds. They are running into patterns you will recognize and patterns you have not seen yet. The knowledge they are accumulating is not interchangeable with yours — but the recipes for accumulating it well are shareable, and that is what we are gathered to share. One user-owned harness, for example, can include an upstream-reporting plugin: after a plugin-code job, it shows the operator the exact issue text and offers a four-step ladder — skip it, file the issue on approval, reword it first, or begin a separate pull-request job. That is one possible controlled feedback component, not a requirement for every harness. Public pattern-accumulation surfaces grow when operators deliberately return proven, privacy-safe lessons through channels appropriate to their own systems.
  - id: s12
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "f54fb0d5a2fb"   # curated source block; drift -> review
    text_hash: "f54fb0d5a2fb"     # narration; change -> re-render
    text: |-
      A consulting practice's seed, six months in, may have hardened a [CLIENT-CONFLICT-CHECK] hook that the practice's principal designed and the seed authored. If the operator chooses to report the pattern upstream, an appropriate public repository can absorb the privacy-safe recipe without absorbing the practice's confidential data. In a harness that uses the contribution gate above, the mechanism enforces only the asking. Whether to report stays the operator's call — Skip is always valid — so another seed can keep its hardened patterns private or use a completely different return path. The component creates useful friction without standardizing the rest of the organism.
  - id: s13
