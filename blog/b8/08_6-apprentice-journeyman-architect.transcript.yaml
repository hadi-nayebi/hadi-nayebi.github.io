    text_hash: "f2e40fc1edb7"     # narration; change -> re-render
    text: |-
      Architect
  - id: s14
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "2b860bed81c6"   # curated source block; drift -> review
    text_hash: "2b860bed81c6"     # narration; change -> re-render
    text: |-
      Month three onward. Most cycles complete without you intervening on basics. The voices speak less, because much of what they used to say has been absorbed into hooks or moved to the knowledge layer. New plugin creation feels routine; the historical kit ceremony from Essay 7.8 becomes the natural rhythm for responding to a proven new pattern. Stage 3 YAML jobs appear more often, and a few proposed Stage 4 plugin-form job designs begin to take shape. The operator's role has shifted from supervising the agent's cognition to directing it at higher-leverage problems.
  - id: s15
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "25c424bb6034"   # curated source block; drift -> review
    text_hash: "25c424bb6034"     # narration; change -> re-render
    text: |-
      What you have now is not a chatbot that you talk to. It is a cognitive instrument that you compose with. The composition still requires intent — the seed does not decide what to work on; you do — while the harness carries a growing mixture of enforced rails and learned discipline.
  - id: s16
    kind: heading
    engine: alt
    sync: in-sync
    gap_after: 0.55
