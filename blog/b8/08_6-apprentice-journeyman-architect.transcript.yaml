    text_hash: "62d863e24446"     # narration; change -> re-render
    text: |-
      Essay 8.5 drew the honest line between enforced size caps and CONDENSE discipline. Both lines describe the brain's maturation. This essay shifts to the operator's arc — the parallel three-stage path you walk while the seed grows around you.
  - id: s03
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "d32d8c45028a"   # curated source block; drift -> review
    text_hash: "d32d8c45028a"     # narration; change -> re-render
    text: |-
      The job-maturation arc from Essay 8.2 describes the jobs. The operator-relationship arc — apprentice, journeyman, architect — here describes the operator. The two arcs often run in parallel: apprentice operators tend to rely on Stage 1 while learning the system; experienced operators are more likely to choose structured multi-cycle jobs or design plugin-form jobs when the work justifies them. These are tendencies, not enforced levels.
  - id: s04
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "bd5fecb8849a"   # curated source block; drift -> review
    text_hash: "bd5fecb8849a"     # narration; change -> re-render
    text: |-
      A real-estate broker operating a brand-new seed will pass through the same arc a research scientist does, just with different artifacts: the broker's apprentice cycles fight the rhythm gates; the broker and seed later choose to rerun a stable comparable-pricing workflow as a multi-cycle job; the broker's architect cycles may produce a comparative-market-analysis plugin that exists nowhere else. The visible markers below are universal to the arc; the substance attached to each marker is the operator's domain. The week-and-month timelines below are heuristic — an intensive operator compresses them; a part-time operator stretches them.
  - id: s05
    kind: heading
    engine: alt
    sync: in-sync
    gap_after: 0.55
    source_hash: "042b8f64044e"   # curated source block; drift -> review
    text_hash: "042b8f64044e"     # narration; change -> re-render
    text: |-
      Apprentice
  - id: s06
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "265a7beb4096"   # curated source block; drift -> review
    text_hash: "265a7beb4096"     # narration; change -> re-render
    text: |-
      Week one. In the historical Claude-based reference implementation, you are figuring out the shape of O P E V C — when to advance phases, when to bail back, and what the rhythm gates are pushing for in practice. Most cycles end in some form of intervention. The agent gets stuck on a phase gate, and you tell it what to do. It misreads scope, and you re-orient it. It writes prose into the wrong project-instruction file, and you point it at the right one. The voices speak to the agent constantly because the patterns are not yet ingrained.
  - id: s07
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "01f5c49e1994"   # curated source block; drift -> review
    text_hash: "01f5c49e1994"     # narration; change -> re-render
    text: |-
      This is the loud phase of cognitive growth — matching hooks firing across tool calls, voices coaching at phase entry, blocks landing whenever the agent reaches for a tool the current phase forbids. Much of what you read in chat is the brain talking to the agent about the brain. The signal-to-noise ratio is bad on purpose: every misfire is a teachable moment, and the brain is busy teaching. Most jobs at this stage are Stage 1, deep single-cycle work. The seed is in learning mode; you are in teaching mode. Together you build the experiential data the seed will compress into its knowledge layer at cycle close.
  - id: s08
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "40fd26981a53"   # curated source block; drift -> review
    text_hash: "40fd26981a53"     # narration; change -> re-render
    text: |-
      The lessons accumulate in three kinds of durable surface: a topical knowledge store, cross-project memory, and each plugin's living history. In the historical implementation, CONDENSE routes findings among those surfaces at cycle close. The brain is bigger at the end of week one than it was at the start — apprenticeship grows by accretion.
  - id: s09
    kind: heading
    engine: alt
    sync: in-sync
    gap_after: 0.55
    source_hash: "8df7d2d06163"   # curated source block; drift -> review
    text_hash: "8df7d2d06163"     # narration; change -> re-render
    text: |-
      Journeyman
  - id: s10
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "07d3d5999270"   # curated source block; drift -> review
    text_hash: "07d3d5999270"     # narration; change -> re-render
    text: |-
      Weeks four through twelve, roughly. Cycles are smoother. The agent and its harness now follow O P E V C discipline with less correction. The rhythm settles — reads and writes alternate without the gates firing as often. Phase advances become routine when the gate criteria are met. Bail-backs still happen, but they are typically real: the plan was wrong, not that the agent forgot to plan.
  - id: s11
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "b0f757fd84de"   # curated source block; drift -> review
    text_hash: "b0f757fd84de"     # narration; change -> re-render
    text: |-
      This is when the work starts settling into repeatable shapes. A blog-writing job you ran as Stage 1 in week two, you and the seed may choose to rerun as a Stage 2 job in week six, after the work has repeated enough to justify a durable prose plan. A research workflow can follow the same path. A stable pattern may justify starting a later job with a Stage 3 YAML plan. These are decisions you and the seed make together, not automatic climbs. The control patterns are also migrating: a coaching voice that has been firing in every cycle for six weeks becomes a candidate for hardening into a hook. The operator and the seed work together on these promotions, recognizing the pattern, writing the hook, and watching the voice retire.
  - id: s12
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "5f95c862e829"   # curated source block; drift -> review
    text_hash: "5f95c862e829"     # narration; change -> re-render
    text: |-
      In the historical implementation, the project-instruction hierarchy starts shrinking as durable findings migrate into plugin behavior or compress into knowledge files. The knowledge store keeps growing; the brain itself approaches equilibrium.
  - id: s13
    kind: heading
    engine: alt
    sync: in-sync
    gap_after: 0.55
