      The Prototype's Plugin Spread
  - id: s17
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "f0d3692262ef"   # curated source block; drift -> review
    text_hash: "f0d3692262ef"     # narration; change -> re-render
    text: |-
      The historical prototype's plugin-version spread makes this arc visible, but only as an imperfect signal. A foundational job plugin can retain an early version and a modest test suite, while an integrity plugin that polices edits across the kit accumulates more revisions and broader tests. Phase plugins likewise develop substantial suites as their gates encounter more cases. Version numbers and test counts reveal exposure and maintenance; they do not prove quality by themselves.
  - id: s18
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "f3af415abad7"   # curated source block; drift -> review
    text_hash: "f3af415abad7"     # narration; change -> re-render
    text: |-
      Across the documented snapshot, the plugins carried many tests, but the total was never the point; the spread was. Mature plugins look different from young plugins, and that difference can appear in test breadth, revision history, and the depth of their living-history narratives. Those signals matter only beside evidence that the controls behave as intended.
  - id: s19
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "9a0e7f66e431"   # curated source block; drift -> review
    text_hash: "9a0e7f66e431"     # narration; change -> re-render
    text: |-
      The limit on this arc, like every limit in this essay series, is friction not enforcement: an operator can stay an apprentice forever by ignoring every promotion signal, or skip to architect by hardening hooks without measurement first. The seed makes the patient path easier than the impatient one; it does not refuse the impatient one.
  - id: s20
    kind: body
    engine: alt
    sync: in-sync
    gap_after: 0.45
    source_hash: "11015b3b96b2"   # curated source block; drift -> review
    text_hash: "11015b3b96b2"     # narration; change -> re-render
    text: |-
      The operator-relationship arc, mirroring the job-maturation arc and the soft-to-hard control arc. The next essay names the deeper claim that ties all three axes together: the brain stops growing in size while the knowledge layer never does.
