<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Hard caps versus soft caps</title><desc id="d">A chalkboard comparison of enforced hard caps and discipline-based soft caps in the Seed reference implementation.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="31" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs><rect width="1200" height="680" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">HARD CAPS VS SOFT CAPS</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">Two hard gates. Three soft disciplines. The asymmetry is intentional.</text><line x1="600" y1="125" x2="600" y2="560" stroke="#f7f2de" stroke-width="3" stroke-dasharray="10 10"/><text x="300" y="150" text-anchor="middle" fill="#f4a7c1" font-size="25" font-weight="700">HARD CAPS</text><text x="300" y="179" text-anchor="middle" fill="#f7f2de" font-size="15">code-enforced</text><text x="900" y="150" text-anchor="middle" fill="#79d6ff" font-size="25" font-weight="700">SOFT CAPS</text><text x="900" y="179" text-anchor="middle" fill="#f7f2de" font-size="15">discipline-enforced</text>
