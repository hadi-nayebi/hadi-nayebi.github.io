<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A checkpoint is a snapshot, a system can have a history</title>
  <desc id="desc">The left side shows one model checkpoint receiving context and producing a response. The right side shows a user-owned harness carrying memory, instructions, evaluations, permissions, and model updates across a timeline, including replacement of the underlying model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8eadf"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#86efac"/></marker>
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="11" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.6"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="#111816"/>
  <rect x="28" y="28" width="1544" height="844" rx="24" fill="none" stroke="#35433d" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f2f0e6">
    <text x="800" y="82" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="1.5">A CHECKPOINT IS A SNAPSHOT. A SYSTEM CAN HAVE A HISTORY.</text>
    <line x1="95" y1="112" x2="1505" y2="112" stroke="#53645d" stroke-width="3"/>
    <rect x="70" y="150" width="560" height="610" rx="28" fill="#121d1a" stroke="#74d4e8" stroke-width="4"/>
    <text x="350" y="205" text-anchor="middle" font-size="31" font-weight="700" fill="#74d4e8">MODEL CHECKPOINT</text>
    <text x="350" y="240" text-anchor="middle" font-size="22" fill="#b8c9c3">stored parametric configuration</text>
    <g filter="url(#chalk)">
      <rect x="175" y="286" width="350" height="86" rx="20" fill="#172722" stroke="#f2f0e6" stroke-width="3"/>
      <text x="350" y="340" text-anchor="middle" font-size="28" font-weight="700">CURRENT CONTEXT</text>
      <line x1="350" y1="375" x2="350" y2="433" stroke="#e8eadf" stroke-width="5" marker-end="url(#arrow)"/>
      <rect x="175" y="442" width="350" height="86" rx="20" fill="#172722" stroke="#f4d35e" stroke-width="3"/>
      <text x="350" y="495" text-anchor="middle" font-size="28" font-weight="700">RUNTIME TRAJECTORY</text>
      <line x1="350" y1="531" x2="350" y2="589" stroke="#e8eadf" stroke-width="5" marker-end="url(#arrow)"/>
      <rect x="175" y="598" width="350" height="86" rx="20" fill="#172722" stroke="#ff9f7a" stroke-width="3"/>
      <text x="350" y="651" text-anchor="middle" font-size="28" font-weight="700">RESPONSE / ACTION</text>
    </g>
    <text x="350" y="715" text-anchor="middle" font-size="23" fill="#ffb9a0">Context closes.</text>
    <text x="350" y="745" text-anchor="middle" font-size="23" fill="#ffb9a0">No biography unless something persists.</text>
    <rect x="680" y="150" width="850" height="610" rx="28" fill="#121d1a" stroke="#86efac" stroke-width="4"/>
    <text x="1105" y="205" text-anchor="middle" font-size="31" font-weight="700" fill="#86efac">TIME-EXTENDED AGENTIC SYSTEM</text>
    <text x="1105" y="240" text-anchor="middle" font-size="22" fill="#b8c9c3">the harness carries selected consequences forward</text>
    <g font-size="21" font-weight="700">
      <rect x="720" y="282" width="175" height="58" rx="16" fill="#172722" stroke="#74d4e8" stroke-width="3"/>
      <text x="808" y="319" text-anchor="middle">MEMORY</text>
      <rect x="918" y="282" width="175" height="58" rx="16" fill="#172722" stroke="#f4d35e" stroke-width="3"/>
      <text x="1006" y="319" text-anchor="middle">INSTRUCTIONS</text>
      <rect x="1116" y="282" width="175" height="58" rx="16" fill="#172722" stroke="#ff9f7a" stroke-width="3"/>
      <text x="1204" y="319" text-anchor="middle">EVALUATIONS</text>
      <rect x="1314" y="282" width="175" height="58" rx="16" fill="#172722" stroke="#c4a7e7" stroke-width="3"/>
      <text x="1402" y="319" text-anchor="middle">PERMISSIONS</text>
    </g>
    <line x1="760" y1="500" x2="1450" y2="500" stroke="#e8eadf" stroke-width="5" marker-end="url(#arrowGreen)"/>
    <g font-size="20" fill="#c9d6cf">
      <text x="760" y="535" text-anchor="middle">T1</text><text x="990" y="535" text-anchor="middle">T2</text><text x="1220" y="535" text-anchor="middle">T3</text><text x="1450" y="535" text-anchor="middle">T4</text>
    </g>
    <g filter="url(#chalk)">
      <circle cx="760" cy="500" r="23" fill="#111816" stroke="#74d4e8" stroke-width="5"/><circle cx="990" cy="500" r="23" fill="#111816" stroke="#f4d35e" stroke-width="5"/><circle cx="1220" cy="500" r="23" fill="#111816" stroke="#ff9f7a" stroke-width="5"/><circle cx="1450" cy="500" r="23" fill="#111816" stroke="#86efac" stroke-width="5"/>
    </g>
    <g font-size="22" font-weight="700">
      <text x="760" y="588" text-anchor="middle">INTERACTION</text><text x="990" y="588" text-anchor="middle">EVALUATION</text><text x="1220" y="576" text-anchor="middle">DURABLE</text><text x="1220" y="604" text-anchor="middle">UPDATE</text><text x="1450" y="576" text-anchor="middle">CHANGED</text><text x="1450" y="604" text-anchor="middle">BEHAVIOR</text>
    </g>
    <rect x="770" y="636" width="235" height="68" rx="18" fill="#172722" stroke="#74d4e8" stroke-width="3"/>
    <text x="888" y="678" text-anchor="middle" font-size="26" font-weight="700">MODEL A</text>
    <line x1="1015" y1="670" x2="1120" y2="670" stroke="#86efac" stroke-width="5" marker-end="url(#arrowGreen)"/>
    <text x="1068" y="646" text-anchor="middle" font-size="19" fill="#86efac">replace</text>
    <rect x="1130" y="636" width="235" height="68" rx="18" fill="#172722" stroke="#86efac" stroke-width="3"/>
    <text x="1248" y="678" text-anchor="middle" font-size="26" font-weight="700">MODEL B</text>
    <text x="1105" y="737" text-anchor="middle" font-size="23" fill="#c9d6cf">History, commitments, and rules can continue across the replacement.</text>
    <rect x="130" y="790" width="1340" height="62" rx="20" fill="#0c1210" stroke="#60746b" stroke-width="3"/>
    <text x="800" y="831" text-anchor="middle" font-size="28" font-weight="700">A MODEL GENERATES A RESPONSE. A SYSTEM CAN ACCUMULATE A BIOGRAPHY.</text>
  </g>
</svg>
