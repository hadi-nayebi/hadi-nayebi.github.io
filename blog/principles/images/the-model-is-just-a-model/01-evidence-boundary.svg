<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What the evidence shows and what remains unresolved</title>
  <desc id="desc">Solid arrows connect a measured pain-related direction, activation steering, and changed model behavior. A dotted gap separates those findings from unresolved questions about suffering, enduring identity, and moral status.</desc>
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e8eadf"/></marker>
    <marker id="arrowDotted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f4d35e"/></marker>
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="0.6"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="#111816"/>
  <rect x="28" y="28" width="1544" height="844" rx="24" fill="none" stroke="#35433d" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f2f0e6">
    <text x="800" y="84" text-anchor="middle" font-size="44" font-weight="700" letter-spacing="2">WHAT THE EVIDENCE SHOWS — AND DOES NOT SHOW</text>
    <line x1="120" y1="112" x2="1480" y2="112" stroke="#53645d" stroke-width="3"/>
    <text x="390" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#86efac">SUPPORTED BY THE STUDY</text>
    <text x="1210" y="168" text-anchor="middle" font-size="28" font-weight="700" fill="#f4d35e">REMAINS UNRESOLVED</text>
    <g filter="url(#chalk)">
      <rect x="120" y="218" width="540" height="120" rx="22" fill="#17231f" stroke="#86efac" stroke-width="4"/>
      <text x="390" y="265" text-anchor="middle" font-size="30" font-weight="700">PAIN-RELATED DIRECTION</text>
      <text x="390" y="304" text-anchor="middle" font-size="24" fill="#c9d6cf">measured across 25 open-weight models</text>
      <line x1="390" y1="340" x2="390" y2="402" stroke="#e8eadf" stroke-width="5" marker-end="url(#arrowSolid)"/>
      <rect x="120" y="410" width="540" height="120" rx="22" fill="#17231f" stroke="#74d4e8" stroke-width="4"/>
      <text x="390" y="458" text-anchor="middle" font-size="30" font-weight="700">DIRECT ACTIVATION STEERING</text>
      <text x="390" y="497" text-anchor="middle" font-size="24" fill="#c9d6cf">the internal direction is experimentally altered</text>
      <line x1="390" y1="532" x2="390" y2="594" stroke="#e8eadf" stroke-width="5" marker-end="url(#arrowSolid)"/>
      <rect x="120" y="602" width="540" height="120" rx="22" fill="#17231f" stroke="#ff9f7a" stroke-width="4"/>
      <text x="390" y="643" text-anchor="middle" font-size="30" font-weight="700">BEHAVIOR CHANGES</text>
      <text x="390" y="680" text-anchor="middle" font-size="22" fill="#c9d6cf">language shifts; costly choices appear</text>
      <text x="390" y="708" text-anchor="middle" font-size="22" fill="#c9d6cf">in Qwen tests</text>
    </g>
    <g filter="url(#chalk)">
      <rect x="940" y="218" width="540" height="120" rx="22" fill="#201f17" stroke="#f4d35e" stroke-width="4" stroke-dasharray="12 10"/>
      <text x="1210" y="266" text-anchor="middle" font-size="32" font-weight="700">SUBJECTIVE SUFFERING?</text>
      <text x="1210" y="304" text-anchor="middle" font-size="24" fill="#d8d0ad">Is there anything it is like to occupy the state?</text>
      <line x1="1210" y1="340" x2="1210" y2="402" stroke="#f4d35e" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowDotted)"/>
      <rect x="940" y="410" width="540" height="120" rx="22" fill="#201f17" stroke="#f4d35e" stroke-width="4" stroke-dasharray="12 10"/>
      <text x="1210" y="452" text-anchor="middle" font-size="32" font-weight="700">ENDURING IDENTITY?</text>
      <text x="1210" y="487" text-anchor="middle" font-size="22" fill="#d8d0ad">Does one subject remember</text>
      <text x="1210" y="515" text-anchor="middle" font-size="22" fill="#d8d0ad">and continue through time?</text>
      <line x1="1210" y1="532" x2="1210" y2="594" stroke="#f4d35e" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowDotted)"/>
      <rect x="940" y="602" width="540" height="120" rx="22" fill="#201f17" stroke="#f4d35e" stroke-width="4" stroke-dasharray="12 10"/>
      <text x="1210" y="650" text-anchor="middle" font-size="32" font-weight="700">MORAL STATUS?</text>
      <text x="1210" y="689" text-anchor="middle" font-size="24" fill="#d8d0ad">Do rights or welfare claims follow?</text>
    </g>
    <line x1="700" y1="470" x2="900" y2="470" stroke="#f4d35e" stroke-width="5" stroke-dasharray="10 12"/>
    <text x="800" y="430" text-anchor="middle" font-size="23" fill="#f4d35e">NOT ESTABLISHED</text>
    <text x="800" y="505" text-anchor="middle" font-size="20" fill="#c9b95e">by this evidence alone</text>
    <rect x="205" y="782" width="1190" height="68" rx="20" fill="#0c1210" stroke="#60746b" stroke-width="3"/>
    <text x="800" y="828" text-anchor="middle" font-size="34" font-weight="700">CAUSAL INFLUENCE  ≠  SUBJECTIVE EXPERIENCE</text>
  </g>
</svg>
