<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
  <title id="title">Same model, different systems</title>
  <desc id="desc">Two possible architectures use the same model and pain-related representation. One retains no pain-related update. The other selects an interpretation, retains it, and returns it to later context. These are design possibilities, not a claim about subjective experience.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e9eee6"/></marker><marker id="loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8de2bd"/></marker></defs>
  <rect width="1400" height="1060" rx="28" fill="#111816"/>
  <rect x="26" y="26" width="1348" height="1008" rx="20" fill="none" stroke="#43554b" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#f2f0e6">
    <text x="700" y="90" font-size="48" font-weight="700">SAME MODEL. DIFFERENT SYSTEMS.</text>
    <text x="700" y="139" font-size="28" fill="#b9c9c0">Two design possibilities</text>
    <rect x="355" y="185" width="690" height="138" rx="22" fill="#19271f" stroke="#d9c878" stroke-width="3"/>
    <text x="700" y="241" font-size="38" font-weight="700">THE SAME LANGUAGE MODEL</text>
    <text x="700" y="290" font-size="31" fill="#d9c878">Pain-related representation retained</text>
    <g stroke="#e9eee6" fill="none" stroke-width="4" marker-end="url(#arrow)"><path d="M545 325 V370 H340 V421"/><path d="M855 325 V370 H1060 V421"/></g>
    <rect x="100" y="435" width="480" height="361" rx="22" fill="#18221e" stroke="#7cb7d3" stroke-width="3"/>
    <text x="340" y="494" font-size="37" font-weight="700" fill="#a5d8ee">TEMPORARY EFFECT</text>
    <text x="340" y="561" font-size="31">Current response reviewed</text>
    <path d="M340 584 V631" stroke="#e9eee6" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="340" y="685" font-size="32">No pain-related update</text>
    <text x="340" y="729" font-size="32">retained for later work</text>
    <rect x="760" y="435" width="480" height="361" rx="22" fill="#18271f" stroke="#8de2bd" stroke-width="3"/>
    <text x="1000" y="494" font-size="37" font-weight="700" fill="#8de2bd">FEEDBACK EFFECT</text>
    <text x="1000" y="557" font-size="31">Select an interpretation</text>
    <path d="M1000 578 V613" stroke="#e9eee6" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1000" y="658" font-size="31">Retain a persistent update</text>
    <path d="M1000 677 V711" stroke="#e9eee6" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="1000" y="757" font-size="31">Shape later context</text>
    <path d="M1243 739 H1305 V252 H1056" fill="none" stroke="#8de2bd" stroke-width="4" marker-end="url(#loop)"/>
    <text x="700" y="886" font-size="40" font-weight="700">Architecture shapes what carries forward.</text>
    <text x="700" y="951" font-size="29" fill="#d9c878">Persistence does not establish subjective experience.</text>
  </g>
</svg>
