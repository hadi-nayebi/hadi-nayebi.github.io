<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">The Model Is Just a Model</title><desc id="desc">Hold the model fixed. Change the surrounding system. Compare a temporary response with selected effects that return through memory and feedback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a9e5c8"/></marker></defs>
<rect width="1200" height="630" fill="#111816"/><rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="#43554b" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#f2f0e6">
<text x="600" y="91" font-size="51" font-weight="700">THE MODEL IS JUST A MODEL</text>
<text x="600" y="147" font-size="31" fill="#d9c878">Hold the model fixed. Change the system.</text>
<rect x="397" y="187" width="406" height="90" rx="17" fill="#19271f" stroke="#d9c878" stroke-width="3"/>
<text x="600" y="243" font-size="35" font-weight="700">SAME MODEL</text>
<path d="M480 279 V315 H280 V347" fill="none" stroke="#a9e5c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M720 279 V315 H920 V347" fill="none" stroke="#a9e5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="360" width="400" height="116" rx="18" fill="#18221e" stroke="#7cb7d3" stroke-width="3"/>
<text x="280" y="409" font-size="30" font-weight="700">TEMPORARY RESPONSE</text><text x="280" y="449" font-size="26" fill="#b9c9c0">No pain-related update retained</text>
<rect x="720" y="360" width="400" height="116" rx="18" fill="#18271f" stroke="#8de2bd" stroke-width="3"/>
<text x="920" y="409" font-size="26" font-weight="700">SELECTED EFFECTS PERSIST</text><text x="920" y="449" font-size="26" fill="#b9c9c0">Memory and feedback</text>
<path d="M1010 358 V234 H816" fill="none" stroke="#8de2bd" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="535" font-size="30">What we carry forward is an architectural choice.</text>
<text x="600" y="580" font-size="23" fill="#a7bdb0">HADOSH ACADEMY</text></g></svg>
