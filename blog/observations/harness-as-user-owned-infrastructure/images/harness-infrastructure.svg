  <g fill="#f2efe4" font-family="system-ui, sans-serif">
    <text x="45" y="170" font-size="28" font-weight="700">REPLACEABLE</text>
    <text x="53" y="204" font-size="28" font-weight="700">MODEL POWER</text>
    <text x="195" y="220" font-size="22" font-weight="700">USER-OWNED</text>
    <text x="211" y="242" font-size="22" font-weight="700">PANEL</text>
    <text x="345" y="205" font-size="31" font-weight="700">CONTROL + PROTECTION</text>
    <text x="805" y="205" font-size="31" font-weight="700">ROUTING + OPERATION</text>
    <text x="350" y="455" font-size="31" font-weight="700">ACCUMULATION</text>
    <text x="350" y="492" font-size="23">corrections • evidence • methods</text>
    <text x="790" y="455" font-size="31" font-weight="700">LEGIBILITY</text>
    <text x="790" y="492" font-size="23">labels • provenance • intervention</text>
    <text x="820" y="395" font-size="22" font-weight="700">LIVING SCHEMATIC + RECORD</text>
    <text x="52" y="648" font-size="22" font-weight="700">PUBLIC GUIDANCE</text>
    <text x="357" y="242" font-size="23">permissions • limits • stop • recovery</text>
    <text x="802" y="242" font-size="23">jobs • tools • state • interfaces</text>
    <text x="324" y="103" font-size="25" fill="#83cf9c">PRIVATE USER TERRITORY</text>
    <text x="898" y="658" font-size="21" fill="#b8b3c4">the user can inspect and intervene</text>
  </g>
