<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Harness as user-owned infrastructure</title>
  <desc id="desc">A cutaway diagram. Replaceable model capability enters a labeled user-owned panel. Four bounded circuits lead to project rooms for control, operation, accumulation, and governance. A living schematic and inspection record remain beside the user. Public guidance stays outside the private building.</desc>
  <rect width="1200" height="720" fill="#101215"/>
