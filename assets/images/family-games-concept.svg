<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Family Games persistent world concept</title>
  <desc id="desc">An original illustrated map showing several family members exploring a persistent family world with animals, a shared home, memory markers, spatial voice, and a child using a wand to awaken an object.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff4ff"/><stop offset="1" stop-color="#a9d8ef"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd58f"/><stop offset="1" stop-color="#6eb47c"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#88d6e6"/><stop offset="1" stop-color="#4fa8c6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183029" flood-opacity=".22"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#sky)"/>
  <path d="M0 270 C170 210 330 245 470 210 C650 165 820 220 1200 175 L1200 675 L0 675 Z" fill="url(#grass)"/>
  <path d="M0 455 C220 390 390 470 560 425 C765 372 950 410 1200 345 L1200 675 L0 675 Z" fill="#72bd76" opacity=".72"/>

  <path d="M100 530 C265 430 365 505 520 420 C675 335 850 430 1095 310" fill="none" stroke="#f3d8a3" stroke-width="44" stroke-linecap="round" opacity=".96"/>
  <path d="M100 530 C265 430 365 505 520 420 C675 335 850 430 1095 310" fill="none" stroke="#e0ba79" stroke-width="3" stroke-dasharray="10 15" opacity=".55"/>

  <path d="M720 520 C765 450 860 440 930 485 C990 523 974 598 904 622 C820 650 734 609 720 520 Z" fill="url(#water)" stroke="#d8f6ff" stroke-width="6"/>
  <ellipse cx="846" cy="572" rx="38" ry="10" fill="#dff9ff" opacity=".4"/>
  <circle cx="914" cy="537" r="7" fill="#dff9ff" opacity=".55"/>

  <!-- distant trees -->
  <g opacity=".92">
    <g transform="translate(95 210)"><rect x="-7" y="46" width="14" height="34" rx="6" fill="#8c6449"/><circle cy="35" r="44" fill="#4d9665"/><circle cx="-24" cy="26" r="28" fill="#65ad75"/><circle cx="24" cy="18" r="30" fill="#5aa06c"/></g>
    <g transform="translate(205 170) scale(.82)"><rect x="-7" y="46" width="14" height="34" rx="6" fill="#8c6449"/><circle cy="35" r="44" fill="#4d9665"/><circle cx="-24" cy="26" r="28" fill="#65ad75"/><circle cx="24" cy="18" r="30" fill="#5aa06c"/></g>
    <g transform="translate(1020 180) scale(.9)"><rect x="-7" y="46" width="14" height="34" rx="6" fill="#8c6449"/><circle cy="35" r="44" fill="#4d9665"/><circle cx="-24" cy="26" r="28" fill="#65ad75"/><circle cx="24" cy="18" r="30" fill="#5aa06c"/></g>
    <g transform="translate(1120 240) scale(.72)"><rect x="-7" y="46" width="14" height="34" rx="6" fill="#8c6449"/><circle cy="35" r="44" fill="#4d9665"/><circle cx="-24" cy="26" r="28" fill="#65ad75"/><circle cx="24" cy="18" r="30" fill="#5aa06c"/></g>
    <g transform="translate(360 235) scale(.68)"><rect x="-7" y="46" width="14" height="34" rx="6" fill="#8c6449"/><circle cy="35" r="44" fill="#4d9665"/><circle cx="-24" cy="26" r="28" fill="#65ad75"/><circle cx="24" cy="18" r="30" fill="#5aa06c"/></g>
  </g>

  <!-- shared home -->
  <g transform="translate(500 270)" filter="url(#shadow)">
    <rect x="0" y="64" width="170" height="118" rx="18" fill="#f3e8cf" stroke="#bd9b79" stroke-width="4"/>
    <path d="M-15 75 L86 2 L185 75 Z" fill="#d86f55" stroke="#9f503f" stroke-width="4"/>
    <rect x="69" y="110" width="42" height="72" rx="8" fill="#8d674d"/>
    <rect x="18" y="98" width="34" height="33" rx="7" fill="#a9d8ef" stroke="#6d9db5" stroke-width="3"/>
    <rect x="126" y="98" width="28" height="33" rx="7" fill="#a9d8ef" stroke="#6d9db5" stroke-width="3"/>
    <rect x="27" y="-1" width="116" height="29" rx="14" fill="#fffaf0" stroke="#cfb591" stroke-width="3"/>
    <text x="85" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#6a5b4a">FAMILY HOME</text>
  </g>

  <!-- animals -->
  <g transform="translate(305 390)" filter="url(#shadow)">
    <ellipse cx="0" cy="24" rx="40" ry="28" fill="#fff5e6" stroke="#a88365" stroke-width="4"/>
    <circle cx="-30" cy="5" r="18" fill="#fff5e6" stroke="#a88365" stroke-width="4"/>
    <path d="M-43 -8 l-11 -17 l19 7 Z M-22 -9 l12 -15 l-2 22 Z" fill="#fff5e6" stroke="#a88365" stroke-width="3"/>
    <circle cx="-35" cy="3" r="3" fill="#2f2b26"/>
    <rect x="-50" y="61" width="105" height="29" rx="14" fill="#fff" opacity=".95"/>
    <text x="3" y="81" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#55483c">LUNA</text>
  </g>
  <g transform="translate(992 400) scale(.88)">
    <ellipse cx="0" cy="24" rx="38" ry="26" fill="#c98663" stroke="#82533c" stroke-width="4"/>
    <circle cx="-28" cy="6" r="17" fill="#c98663" stroke="#82533c" stroke-width="4"/>
    <path d="M-42 -8 l-8 -18 l17 8 Z M-18 -10 l11 -15 l0 22 Z" fill="#c98663" stroke="#82533c" stroke-width="3"/>
    <circle cx="-34" cy="4" r="3" fill="#26221f"/>
  </g>

  <!-- memory marker -->
  <g transform="translate(205 505)" filter="url(#shadow)">
    <rect x="-22" y="-42" width="44" height="54" rx="14" fill="#f7b7c6" stroke="#ae6f80" stroke-width="3"/>
    <circle cy="-15" r="10" fill="#fff" opacity=".9"/>
    <path d="M-9 -14 q9 14 18 0" fill="none" stroke="#ae6f80" stroke-width="3" stroke-linecap="round"/>
    <rect x="-34" y="18" width="68" height="24" rx="12" fill="#fff" opacity=".94"/>
    <text x="0" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#79545e">MEMORY</text>
  </g>

  <!-- family avatars -->
  <g font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <g transform="translate(205 335)" filter="url(#shadow)"><circle r="25" fill="#6e83d8"/><circle cy="-8" r="8" fill="#f3c4a5"/><path d="M-12 18 q12 -16 24 0" fill="#253a75"/><text y="42" fill="#233244">MOM</text></g>
    <g transform="translate(408 330)" filter="url(#shadow)"><circle r="25" fill="#d6796e"/><circle cy="-8" r="8" fill="#dba27d"/><path d="M-12 18 q12 -16 24 0" fill="#74342f"/><text y="42" fill="#233244">DAD</text></g>
    <g transform="translate(735 345)" filter="url(#shadow)"><circle r="23" fill="#f2c65c"/><circle cy="-7" r="7" fill="#eab28b"/><path d="M-11 17 q11 -15 22 0" fill="#8e6917"/><text y="40" fill="#233244">KID</text></g>
    <g transform="translate(880 340)" filter="url(#shadow)"><circle r="23" fill="#a778d8"/><circle cy="-7" r="7" fill="#c78f70"/><path d="M-11 17 q11 -15 22 0" fill="#5b357c"/><text y="40" fill="#233244">AUNT</text></g>
    <g transform="translate(1040 520)" filter="url(#shadow)"><circle r="22" fill="#5fb7a5"/><circle cy="-7" r="7" fill="#efc5a5"/><path d="M-10 16 q10 -14 20 0" fill="#245f53"/><text y="39" fill="#233244">GRANDPA</text></g>
  </g>

  <!-- proximity voice rings -->
  <g fill="none" stroke="#6f88f0" stroke-width="3" opacity=".42">
    <circle cx="205" cy="335" r="47"/><circle cx="205" cy="335" r="64"/>
    <circle cx="408" cy="330" r="46"/>
  </g>
  <path d="M249 330 C290 305 334 306 365 326" fill="none" stroke="#6f88f0" stroke-width="3" stroke-dasharray="7 8" opacity=".6"/>

  <!-- wand awakening -->
  <g transform="translate(735 345)">
    <path d="M18 10 L73 -25" stroke="#7c5cff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="78" cy="-29" r="10" fill="#fff6a3"/>
    <g fill="#fff6a3" opacity=".95"><circle cx="101" cy="-47" r="5"/><circle cx="91" cy="-15" r="4"/><circle cx="112" cy="-22" r="3"/><circle cx="84" cy="-58" r="3"/></g>
  </g>
  <g transform="translate(827 300)" filter="url(#shadow)">
    <rect x="-24" y="14" width="48" height="50" rx="8" fill="#8b6d50"/>
    <circle cy="0" r="34" fill="#5ca56d" stroke="#3c7c50" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#fff6a3" stroke-width="4" stroke-dasharray="5 10" opacity=".8"/>
  </g>

  <!-- subtle labels -->
  <g font-family="system-ui,sans-serif" font-weight="700" fill="#2f4a42">
    <rect x="85" y="70" width="290" height="55" rx="27" fill="#ffffff" opacity=".86"/>
    <text x="230" y="104" text-anchor="middle" font-size="19">ONE FAMILY · ONE PERSISTENT WORLD</text>
  </g>
</svg>
