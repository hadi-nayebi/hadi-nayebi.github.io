<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Family Games persistent world concept</title>
  <desc id="desc">An original illustrated map showing several family members exploring a persistent family world with animals, a shared home, memory markers, spatial voice, and a child using a wand to awaken an object.</desc>
