<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">The user-owned layer</title><desc id="d">A chalkboard stack showing runtime, Seed cognition, and the user's own world, with the middle and top layers remaining user-owned while models can change.</desc><defs><filter id="c"><feTurbulence baseFrequency=".014" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter></defs><rect width="1200" height="700" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">THE USER-OWNED LAYER</text><text x="600" y="93" text-anchor="middle" fill="#8fd3ff" font-size="17">Models can change. Your cognition and experience stay with you.</text>
<g transform="translate(170 150)"><rect x="0" y="330" width="620" height="125" rx="28" fill="rgba(121,214,255,.06)" stroke="#79d6ff" stroke-width="4"/><text x="310" y="370" text-anchor="middle" fill="#79d6ff" font-size="23" font-weight="700">RUNTIME LAYER</text><text x="310" y="402" text-anchor="middle" fill="#f7f2de" font-size="17">Codex today · another runtime tomorrow</text><text x="310" y="430" text-anchor="middle" fill="#aab0ba" font-size="14">model sessions · tools · sandbox · permissions</text>
<rect x="0" y="170" width="620" height="135" rx="28" fill="rgba(216,156,255,.06)" stroke="#d89cff" stroke-width="4"/><text x="310" y="208" text-anchor="middle" fill="#d89cff" font-size="23" font-weight="700">SEED COGNITION</text><text x="310" y="243" text-anchor="middle" fill="#f7f2de" font-size="17">jobs · plugins · phases · memory · authority · verification</text><text x="310" y="274" text-anchor="middle" fill="#f4a7c1" font-size="15">this is the durable user-owned harness</text>
<rect x="0" y="0" width="620" height="140" rx="28" fill="rgba(242,164,92,.06)" stroke="#f2a45c" stroke-width="4"/><text x="310" y="40" text-anchor="middle" fill="#f2a45c" font-size="23" font-weight="700">YOUR WORLD</text><text x="310" y="76" text-anchor="middle" fill="#f7f2de" font-size="17">your jobs · knowledge · history · goals · preferences</text><text x="310" y="108" text-anchor="middle" fill="#f7d56b" font-size="15">specific to you; local to your deployment</text></g>
<g transform="translate(850 210)"><path d="M45 10 q110 70 0 140" fill="none" stroke="#7ed9a4" stroke-width="4"/><path d="M45 150 q110 70 0 140" fill="none" stroke="#7ed9a4" stroke-width="4"/><text x="100" y="68" text-anchor="middle" fill="#7ed9a4" font-size="18">switch models</text><text x="100" y="96" text-anchor="middle" fill="#f7f2de" font-size="15">without giving up</text><text x="100" y="120" text-anchor="middle" fill="#f7f2de" font-size="15">your accumulated layer</text><rect x="5" y="330" width="210" height="90" rx="15" fill="none" stroke="#f4a7c1" stroke-width="3"/><text x="110" y="365" text-anchor="middle" fill="#f4a7c1" font-size="18">PORTABLE ASSET</text><text x="110" y="393" text-anchor="middle" fill="#f7f2de" font-size="14">your harness is the thing</text><text x="110" y="414" text-anchor="middle" fill="#f7f2de" font-size="14">that becomes valuable</text></g>
<text x="600" y="652" text-anchor="middle" fill="#f4a7c1" font-size="19">The model is replaceable. The accumulated architecture around your work is not.</text></g></svg>