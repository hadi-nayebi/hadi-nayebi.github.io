<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">One lineage, two public branches</title><desc id="d">A chalkboard tree showing the Claude Seed reference implementation branching into Seed Agent on Codex and Q-Seed on Qwen Code while carrying forward jobs, memory, plugins, phases, authority and verification.</desc><defs><filter id="c"><feTurbulence baseFrequency=".012" numOctaves="2" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs><rect width="1200" height="680" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial, sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">ONE LINEAGE, TWO PUBLIC BRANCHES</text><text x="600" y="93" text-anchor="middle" fill="#8fd3ff" font-size="17">Same behavioral questions. Different runtime boundaries.</text>
<path d="M355 520 C370 420 420 330 520 250 C585 198 590 160 600 120" fill="none" stroke="#d3a86a" stroke-width="13" stroke-linecap="round"/><path d="M430 560 C470 475 520 405 570 340" fill="none" stroke="#8b6a45" stroke-width="8"/><path d="M570 335 C520 280 470 225 400 170" fill="none" stroke="#7ed9a4" stroke-width="8"/><path d="M570 335 C650 270 735 220 840 170" fill="none" stroke="#79d6ff" stroke-width="8"/><path d="M600 325 C690 320 790 350 900 430" fill="none" stroke="#d89cff" stroke-width="8"/>
<g fill="#7ed9a4"><circle cx="350" cy="155" r="22"/><circle cx="400" cy="122" r="25"/><circle cx="445" cy="165" r="20"/><circle cx="390" cy="200" r="24"/></g><g fill="#79d6ff"><circle cx="800" cy="142" r="23"/><circle cx="850" cy="115" r="25"/><circle cx="900" cy="150" r="22"/><circle cx="842" cy="190" r="24"/></g><g fill="#d89cff"><circle cx="860" cy="410" r="22"/><circle cx="920" cy="392" r="24"/><circle cx="965" cy="435" r="22"/><circle cx="905" cy="460" r="24"/></g>
<text x="395" y="255" text-anchor="middle" fill="#7ed9a4" font-size="25" font-weight="700">CLAUDE SEED</text><text x="395" y="282" text-anchor="middle" fill="#f7f2de" font-size="15">reference implementation</text><text x="850" y="255" text-anchor="middle" fill="#79d6ff" font-size="25" font-weight="700">SEED AGENT</text><text x="850" y="282" text-anchor="middle" fill="#f7f2de" font-size="15">Codex public path</text><text x="915" y="515" text-anchor="middle" fill="#d89cff" font-size="25" font-weight="700">Q-SEED</text><text x="915" y="542" text-anchor="middle" fill="#f7f2de" font-size="15">Qwen Code public path</text>
<rect x="115" y="365" width="285" height="185" rx="18" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="257" y="400" text-anchor="middle" fill="#f2a45c" font-size="18" font-weight="700">WHAT THE LINEAGE CARRIES</text><g fill="#f7f2de" font-size="16"><text x="145" y="438">• persistent jobs</text><text x="145" y="468">• working memory</text><text x="145" y="498">• plugins + phases</text><text x="145" y="528">• authority + verification</text></g>
<text x="600" y="625" text-anchor="middle" fill="#f4a7c1" font-size="19">The architecture is inherited as evidence, not copied as a fossil. Each runtime can reshape the implementation.</text></g></svg>