<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">A world your family lives in</title><desc id="d">A chalkboard storybook showing a family together tonight, children exploring between gatherings, and the same world years later filled with memories, named animals and structures.</desc><defs><filter id="c"><feTurbulence baseFrequency=".012" numOctaves="2" seed="15" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs><rect width="1200" height="720" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="60" text-anchor="middle" fill="#8fd3ff" font-size="35" font-weight="700">A WORLD YOUR FAMILY LIVES IN</text><text x="600" y="92" text-anchor="middle" fill="#f7f2de" font-size="17">Stories, exploration, communication and memory — together and apart.</text>
<g transform="translate(40 135)"><rect width="350" height="410" rx="22" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="175" y="38" text-anchor="middle" fill="#79d6ff" font-size="21" font-weight="700">TOGETHER TONIGHT</text><circle cx="90" cy="160" r="25" fill="none" stroke="#f2a45c" stroke-width="3"/><circle cx="160" cy="135" r="25" fill="none" stroke="#7ed9a4" stroke-width="3"/><circle cx="225" cy="165" r="25" fill="none" stroke="#d89cff" stroke-width="3"/><circle cx="275" cy="125" r="20" fill="none" stroke="#f7d56b" stroke-width="3"/><path d="M60 215 q120 70 235 0" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M72 230 q100-70 205 0" fill="none" stroke="#8fd3ff" stroke-width="2" stroke-dasharray="7 8"/><path d="M110 315 q65-60 130 0" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="175" y="350" text-anchor="middle" fill="#f7f2de" font-size="15">spatial voice · shared play</text><text x="175" y="376" text-anchor="middle" fill="#f7f2de" font-size="15">family decisions · celebrations</text></g>
<g transform="translate(425 135)"><rect width="350" height="410" rx="22" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="175" y="38" text-anchor="middle" fill="#f2a45c" font-size="21" font-weight="700">BETWEEN GATHERINGS</text><circle cx="115" cy="150" r="24" fill="none" stroke="#f7d56b" stroke-width="3"/><path d="M80 210 q35-42 70 0" fill="none" stroke="#f7d56b" stroke-width="3"/><path d="M190 235 l38-80 l38 80z" fill="none" stroke="#7ed9a4" stroke-width="3"/><circle cx="260" cy="145" r="18" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M250 165 q15 35 38 5" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M115 225 L170 190" stroke="#d89cff" stroke-width="4"/><circle cx="178" cy="184" r="7" fill="#d89cff"/><path d="M178 184 q20-18 35 0 q18 16 0 34 q-18 18-35 0" fill="none" stroke="#8fd3ff" stroke-width="3"/><text x="175" y="325" text-anchor="middle" fill="#f7f2de" font-size="15">explore · learn · care for animals</text><text x="175" y="351" text-anchor="middle" fill="#f7f2de" font-size="15">create surprises for the next gathering</text><text x="175" y="384" text-anchor="middle" fill="#d89cff" font-size="14">the wand turns latent scenery into persistent objects</text></g>
<g transform="translate(810 135)"><rect width="350" height="410" rx="22" fill="none" stroke="#d89cff" stroke-width="3"/><text x="175" y="38" text-anchor="middle" fill="#d89cff" font-size="21" font-weight="700">YEARS LATER</text><path d="M30 265 q70-150 135 0 q70-145 155 0" fill="none" stroke="#7ed9a4" stroke-width="3"/><rect x="72" y="190" width="90" height="70" fill="none" stroke="#f2a45c" stroke-width="3"/><path d="M65 190 l52-45 l53 45" fill="none" stroke="#f2a45c" stroke-width="3"/><path d="M210 250 v-92 m0 0 q-35 18-42 48 m42-48 q35 18 42 48" fill="none" stroke="#f7d56b" stroke-width="3"/><circle cx="280" cy="210" r="22" fill="none" stroke="#8fd3ff" stroke-width="3"/><path d="M270 231 q22 36 43 6" fill="none" stroke="#8fd3ff" stroke-width="3"/><text x="280" y="170" text-anchor="middle" fill="#8fd3ff" font-size="14">Daisy</text><circle cx="105" cy="315" r="13" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M105 328 v34" stroke="#f4a7c1" stroke-width="3"/><text x="175" y="350" text-anchor="middle" fill="#f7f2de" font-size="15">named animals · structures · voice memories</text><text x="175" y="376" text-anchor="middle" fill="#f7f2de" font-size="15">traditions become visible places</text></g>
<g transform="translate(135 590)" font-size="15" text-anchor="middle"><circle cx="80" cy="0" r="26" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="80" y="48" fill="#f7f2de">named animals</text><circle cx="320" cy="0" r="26" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="320" y="48" fill="#f7f2de">spatial voice</text><circle cx="560" cy="0" r="26" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="560" y="48" fill="#f7f2de">persistent world</text><circle cx="800" cy="0" r="26" fill="none" stroke="#d89cff" stroke-width="3"/><text x="800" y="48" fill="#f7f2de">shared memories</text></g>
<text x="600" y="682" text-anchor="middle" fill="#f4a7c1" font-size="18">The world is the interface. The harness quietly keeps the world persistent, private and specific to the family.</text></g></svg>