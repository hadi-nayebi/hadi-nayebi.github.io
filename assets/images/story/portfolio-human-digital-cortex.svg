<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Human brain and digital cortex cycle</title><desc id="d">A chalkboard cycle in which human ideas and judgment enter the digital cortex as jobs and behaviors, execution and memory happen there, results return to human judgment, and learning improves the system.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="24" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#f7e9b0" stroke-width="1.5"/></marker></defs><rect width="1200" height="680" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="35" font-weight="700">HUMAN BRAIN ↔ DIGITAL CORTEX</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">Ideas leave. Execution happens. Understanding returns.</text>
<g transform="translate(90 185)"><circle cx="120" cy="130" r="85" fill="none" stroke="#f2a45c" stroke-width="4"/><path d="M80 118 q20-45 45-10 q20-40 50-5 q30 0 35 35 q-10 35-50 36 q-35 30-62-5 q-38-5-30-42" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="120" y="245" text-anchor="middle" fill="#f2a45c" font-size="22" font-weight="700">HUMAN CORTEX</text><g fill="#f7f2de" font-size="15" text-anchor="middle"><text x="120" y="278">goals · judgment · taste</text><text x="120" y="302">values · ethics · direction</text></g></g>
<g transform="translate(445 155)"><rect width="310" height="355" rx="28" fill="none" stroke="#79d6ff" stroke-width="4"/><text x="155" y="42" text-anchor="middle" fill="#79d6ff" font-size="22" font-weight="700">DIGITAL CORTEX</text><rect x="45" y="85" width="220" height="70" rx="14" fill="none" stroke="#d89cff" stroke-width="3"/><text x="155" y="115" text-anchor="middle" fill="#d89cff" font-size="17">JOB / BEHAVIOR</text><text x="155" y="140" text-anchor="middle" fill="#f7f2de" font-size="14">make the idea persistent</text><rect x="45" y="185" width="220" height="70" rx="14" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="155" y="215" text-anchor="middle" fill="#7ed9a4" font-size="17">EXECUTE + COORDINATE</text><text x="155" y="240" text-anchor="middle" fill="#f7f2de" font-size="14">memory · parallel work · checks</text><rect x="45" y="285" width="220" height="45" rx="12" fill="none" stroke="#f7d56b" stroke-width="3"/><text x="155" y="313" text-anchor="middle" fill="#f7d56b" font-size="16">REMEMBER + LEARN</text></g>
<g transform="translate(885 185)"><circle cx="120" cy="130" r="85" fill="none" stroke="#d89cff" stroke-width="4"/><path d="M85 135 q35-50 70 0 q35-50 70 0" fill="none" stroke="#d89cff" stroke-width="3"/><text x="120" y="245" text-anchor="middle" fill="#d89cff" font-size="22" font-weight="700">BACK TO HUMAN</text><g fill="#f7f2de" font-size="15" text-anchor="middle"><text x="120" y="278">review · judge · decide</text><text x="120" y="302">create the next idea</text></g></g>
<path d="M300 305 C355 235 390 225 440 225" fill="none" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/><text x="365" y="208" text-anchor="middle" fill="#f4a7c1" font-size="15">idea / intention</text><path d="M760 225 C820 225 840 245 875 305" fill="none" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/><text x="820" y="208" text-anchor="middle" fill="#7ed9a4" font-size="15">results / evidence</text><path d="M1000 420 C930 555 790 605 600 605 C410 605 265 555 200 420" fill="none" stroke="#8fd3ff" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#a)"/><text x="600" y="635" text-anchor="middle" fill="#8fd3ff" font-size="18">Learning flows back into the harness. The cycle gets wiser.</text></g></svg>