<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">How deep does ownership go?</title><desc id="d">A chalkboard comparison between Codex Seed, where the runtime is external, and Q-Seed, where the framework layer can also be user-controlled.</desc><defs><filter id="c"><feTurbulence baseFrequency=".014" numOctaves="2" seed="12" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs><rect width="1200" height="680" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">HOW DEEP DOES OWNERSHIP GO?</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">Two Seed paths. Same goal: a digital cortex the user can understand and control.</text>
<g transform="translate(105 145)"><text x="225" y="0" text-anchor="middle" fill="#79d6ff" font-size="24" font-weight="700">CODEX SEED</text><rect x="0" y="45" width="450" height="115" rx="22" fill="none" stroke="#f2a45c" stroke-width="4"/><text x="225" y="82" text-anchor="middle" fill="#f2a45c" font-size="20" font-weight="700">YOUR LAYER</text><text x="225" y="116" text-anchor="middle" fill="#f7f2de" font-size="16">jobs · knowledge · history · preferences</text><rect x="0" y="185" width="450" height="130" rx="22" fill="none" stroke="#d89cff" stroke-width="4"/><text x="225" y="225" text-anchor="middle" fill="#d89cff" font-size="20" font-weight="700">SEED COGNITION</text><text x="225" y="260" text-anchor="middle" fill="#f7f2de" font-size="16">memory · phases · plugins · verification</text><rect x="0" y="340" width="450" height="120" rx="22" fill="none" stroke="#79d6ff" stroke-width="4"/><text x="225" y="380" text-anchor="middle" fill="#79d6ff" font-size="20" font-weight="700">EXTERNAL RUNTIME</text><text x="225" y="415" text-anchor="middle" fill="#f7f2de" font-size="16">Codex provides the framework</text><text x="225" y="445" text-anchor="middle" fill="#aab0ba" font-size="14">you own the cognition above it</text></g>
<text x="600" y="365" text-anchor="middle" fill="#f7e9b0" font-size="30" font-weight="700">VS.</text>
<g transform="translate(645 145)"><text x="225" y="0" text-anchor="middle" fill="#d89cff" font-size="24" font-weight="700">Q-SEED</text><rect x="0" y="45" width="450" height="115" rx="22" fill="none" stroke="#f2a45c" stroke-width="4"/><text x="225" y="82" text-anchor="middle" fill="#f2a45c" font-size="20" font-weight="700">YOUR LAYER</text><text x="225" y="116" text-anchor="middle" fill="#f7f2de" font-size="16">jobs · knowledge · history · preferences</text><rect x="0" y="185" width="450" height="130" rx="22" fill="none" stroke="#d89cff" stroke-width="4"/><text x="225" y="225" text-anchor="middle" fill="#d89cff" font-size="20" font-weight="700">SEED COGNITION</text><text x="225" y="260" text-anchor="middle" fill="#f7f2de" font-size="16">memory · phases · plugins · verification</text><rect x="0" y="340" width="450" height="120" rx="22" fill="none" stroke="#7ed9a4" stroke-width="4"/><text x="225" y="380" text-anchor="middle" fill="#7ed9a4" font-size="20" font-weight="700">USER-CONTROLLED FRAMEWORK</text><text x="225" y="415" text-anchor="middle" fill="#f7f2de" font-size="16">Qwen Code fork can evolve too</text><text x="225" y="445" text-anchor="middle" fill="#aab0ba" font-size="14">deeper ownership · deeper responsibility</text></g>
<text x="600" y="635" text-anchor="middle" fill="#f4a7c1" font-size="19">Q-Seed asks which guarantees become cleaner when the runtime itself is part of the owned stack.</text></g></svg>