<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">From individual to group to collective</title><desc id="d">A chalkboard scale map showing how Hadosh projects change from personal CLI harnesses to shared team systems, family worlds and wider collectives.</desc><defs><filter id="c"><feTurbulence baseFrequency=".014" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#f7e9b0" stroke-width="1.5"/></marker></defs><rect width="1200" height="660" rx="26" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial, sans-serif"><text x="600" y="65" text-anchor="middle" fill="#f7f2de" font-size="34" font-weight="700">FROM INDIVIDUAL TO COLLECTIVE</text><text x="600" y="94" text-anchor="middle" fill="#90d9ff" font-size="17">The philosophy stays. The interface and governance evolve with scale.</text>
<g transform="translate(45 150)"><rect width="245" height="360" rx="22" fill="none" stroke="#77d7ff" stroke-width="3"/><text x="122" y="42" text-anchor="middle" fill="#77d7ff" font-size="21" font-weight="700">INDIVIDUAL</text><circle cx="120" cy="115" r="32" fill="none" stroke="#f7f2de" stroke-width="3"/><path d="M78 205 q42-45 84 0" fill="none" stroke="#f7f2de" stroke-width="3"/><rect x="65" y="218" width="112" height="70" rx="8" fill="none" stroke="#f2a45c" stroke-width="3"/><path d="M95 245 h50 M95 263 h36" stroke="#f2a45c" stroke-width="3"/><text x="122" y="322" text-anchor="middle" fill="#f7f2de" font-size="16">Seed Agent · Q-Seed</text><text x="122" y="346" text-anchor="middle" fill="#a9b0ba" font-size="14">personal CLI · local context</text></g>
<path d="M300 330 H365" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(375 150)"><rect width="245" height="360" rx="22" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="122" y="42" text-anchor="middle" fill="#7ed9a4" font-size="21" font-weight="700">GROUP</text><g fill="none" stroke="#f7f2de" stroke-width="2.5"><circle cx="68" cy="113" r="22"/><circle cx="122" cy="96" r="22"/><circle cx="176" cy="113" r="22"/></g><rect x="54" y="165" width="136" height="94" rx="12" fill="none" stroke="#f7d56b" stroke-width="3"/><path d="M80 195 h85 M80 217 h63" stroke="#f7d56b" stroke-width="3"/><text x="122" y="297" text-anchor="middle" fill="#f7f2de" font-size="16">Team Harnesses</text><text x="122" y="321" text-anchor="middle" fill="#a9b0ba" font-size="14">shared repo · dashboard</text><text x="122" y="345" text-anchor="middle" fill="#a9b0ba" font-size="14">2–7 people</text></g>
<path d="M630 330 H695" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(705 150)"><rect width="210" height="360" rx="22" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="105" y="42" text-anchor="middle" fill="#f2a45c" font-size="21" font-weight="700">FAMILY</text><path d="M28 190 q75-110 155 0" fill="none" stroke="#f4a7c1" stroke-width="3"/><circle cx="58" cy="120" r="18" fill="none" stroke="#f7f2de" stroke-width="2.5"/><circle cx="105" cy="98" r="18" fill="none" stroke="#f7f2de" stroke-width="2.5"/><circle cx="151" cy="120" r="18" fill="none" stroke="#f7f2de" stroke-width="2.5"/><path d="M35 230 q70 50 140 0" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="105" y="296" text-anchor="middle" fill="#f7f2de" font-size="16">Family Games</text><text x="105" y="320" text-anchor="middle" fill="#a9b0ba" font-size="14">persistent shared world</text><text x="105" y="344" text-anchor="middle" fill="#a9b0ba" font-size="14">7–15 people</text></g>
<path d="M925 330 H975" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(985 150)"><rect width="170" height="360" rx="22" fill="none" stroke="#d89cff" stroke-width="3"/><text x="85" y="42" text-anchor="middle" fill="#d89cff" font-size="20" font-weight="700">COLLECTIVE</text><circle cx="85" cy="145" r="55" fill="none" stroke="#8fd3ff" stroke-width="3"/><g fill="#f7f2de"><circle cx="45" cy="130" r="5"/><circle cx="70" cy="102" r="5"/><circle cx="105" cy="105" r="5"/><circle cx="125" cy="140" r="5"/><circle cx="92" cy="165" r="5"/><circle cx="58" cy="170" r="5"/></g><path d="M30 222 h110 M42 242 h86" stroke="#f2a45c" stroke-width="3"/><text x="85" y="296" text-anchor="middle" fill="#f7f2de" font-size="15">crowd projects</text><text x="85" y="320" text-anchor="middle" fill="#a9b0ba" font-size="13">email · light touch</text><text x="85" y="344" text-anchor="middle" fill="#a9b0ba" font-size="13">shared value</text></g>
<text x="600" y="585" text-anchor="middle" fill="#f4a7c1" font-size="19">One user → shared team cortex → intimate family world → crowd-powered collective.</text></g></svg>