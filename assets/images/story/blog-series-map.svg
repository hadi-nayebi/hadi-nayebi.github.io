<g transform="translate(1005 175)" text-anchor="middle"><rect width="150" height="270" rx="20" fill="none" stroke="#f4a7c1" stroke-width="3"/><text x="75" y="38" fill="#f4a7c1" font-size="19" font-weight="700">B8</text><text x="75" y="72" fill="#f7f2de" font-size="16">MATURATION</text><path d="M30 190 h35 v-40 h35 v-40 h35" fill="none" stroke="#f4a7c1" stroke-width="4"/><text x="75" y="220" fill="#aab0ba" font-size="13">soft → hard</text><text x="75" y="243" fill="#aab0ba" font-size="13">operator → architect</text></g>
<text x="600" y="520" text-anchor="middle" fill="#f7d56b" font-size="19">The essays are documentation of a working architecture, not a feature list.</text><text x="600" y="552" text-anchor="middle" fill="#f4a7c1" font-size="17">Use the map to enter at the depth that matches your question.</text></g></svg>