<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Map of the Hadosh technical writing</title><desc id="d">A chalkboard map showing the conceptual essays leading into the B5 always-on cortex, B6 phasic brain, B7 plugin kit and B8 maturation series.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="34" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#f7e9b0" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="35" font-weight="700">A MAP OF THE TECHNICAL WRITING</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">Start with the idea. Then follow one real Seed from foundations to maturation.</text>
<g transform="translate(45 175)" text-anchor="middle"><rect width="190" height="270" rx="20" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="95" y="38" fill="#79d6ff" font-size="19" font-weight="700">B1–B4</text><text x="95" y="72" fill="#f7f2de" font-size="16">WHY + LANGUAGE</text><path d="M45 125 h100 M60 150 h70 M55 175 h80" stroke="#79d6ff" stroke-width="3"/><text x="95" y="215" fill="#aab0ba" font-size="13">model ≠ agent</text><text x="95" y="238" fill="#aab0ba" font-size="13">digital cortex</text><text x="95" y="261" fill="#aab0ba" font-size="13">shared vocabulary</text></g><path d="M245 310 H275" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(285 175)" text-anchor="middle"><rect width="190" height="270" rx="20" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="95" y="38" fill="#f2a45c" font-size="19" font-weight="700">B5</text><text x="95" y="72" fill="#f7f2de" font-size="16">ALWAYS-ON CORTEX</text><circle cx="95" cy="145" r="45" fill="none" stroke="#f2a45c" stroke-width="3"/><path d="M70 145 h50 M95 120 v50" stroke="#f2a45c" stroke-width="3"/><text x="95" y="220" fill="#aab0ba" font-size="13">jobs · guards</text><text x="95" y="243" fill="#aab0ba" font-size="13">memory · questions</text></g><path d="M485 310 H515" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(525 175)" text-anchor="middle"><rect width="190" height="270" rx="20" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="95" y="38" fill="#7ed9a4" font-size="19" font-weight="700">B6</text><text x="95" y="72" fill="#f7f2de" font-size="16">PHASIC BRAIN</text><circle cx="95" cy="145" r="48" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="95" y="140" fill="#f7f2de" font-size="13">O · P · E</text><text x="95" y="160" fill="#f7f2de" font-size="13">V · C</text><text x="95" y="220" fill="#aab0ba" font-size="13">cognitive modes</text><text x="95" y="243" fill="#aab0ba" font-size="13">transitions · rollback</text></g><path d="M725 310 H755" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
