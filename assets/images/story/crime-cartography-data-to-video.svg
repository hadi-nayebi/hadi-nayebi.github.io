<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">From data to video</title><desc id="d">A chalkboard production path from city data exploration through visualization and story construction to video production and human crowd enhancement.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="21" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#f7e9b0" stroke-width="1.5"/></marker></defs><rect width="1200" height="640" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">FROM DATA TO VIDEO</text><text x="600" y="92" text-anchor="middle" fill="#8fd3ff" font-size="17">One harness does the repeatable production; the crowd improves what deserves human judgment.</text>
<g transform="translate(55 170)" text-anchor="middle"><rect width="190" height="235" rx="20" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="95" y="40" fill="#79d6ff" font-size="18" font-weight="700">1 · EXPLORE</text><path d="M30 150 q35-95 70 0 q38-65 60 0" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="95" y="190" fill="#f7f2de" font-size="14">trends + patterns</text><text x="95" y="212" fill="#f7f2de" font-size="14">per city</text></g><path d="M255 285 H300" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(310 170)" text-anchor="middle"><rect width="190" height="235" rx="20" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="95" y="40" fill="#f2a45c" font-size="18" font-weight="700">2 · VISUALIZE</text><rect x="35" y="80" width="120" height="90" rx="10" fill="none" stroke="#f2a45c" stroke-width="3"/><path d="M50 148 l25-35 l25 22 l35-48" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="95" y="190" fill="#f7f2de" font-size="14">charts · maps</text><text x="95" y="212" fill="#f7f2de" font-size="14">comparisons</text></g><path d="M510 285 H555" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(565 170)" text-anchor="middle"><rect width="190" height="235" rx="20" fill="none" stroke="#d89cff" stroke-width="3"/><text x="95" y="40" fill="#d89cff" font-size="18" font-weight="700">3 · TELL THE STORY</text><path d="M55 80 h80 v95 h-80z" fill="none" stroke="#d89cff" stroke-width="3"/><path d="M70 105 h50 M70 127 h50 M70 149 h35" stroke="#f7f2de" stroke-width="2.5"/><text x="95" y="190" fill="#f7f2de" font-size="14">script + context</text><text x="95" y="212" fill="#f7f2de" font-size="14">questions + caveats</text></g><path d="M765 285 H810" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(820 170)" text-anchor="middle"><rect width="190" height="235" rx="20" fill="none" stroke="#f4a7c1" stroke-width="3"/><text x="95" y="40" fill="#f4a7c1" font-size="18" font-weight="700">4 · PRODUCE</text><rect x="37" y="88" width="116" height="74" rx="13" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M75 105 l45 20 l-45 20z" fill="none" stroke="#f4a7c1" stroke-width="3"/><text x="95" y="190" fill="#f7f2de" font-size="14">video · voice</text><text x="95" y="212" fill="#f7f2de" font-size="14">graphics + edits</text></g><path d="M1020 285 H1060" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(1060 170)" text-anchor="middle"><circle cx="40" cy="95" r="18" fill="none" stroke="#7ed9a4" stroke-width="3"/><circle cx="90" cy="75" r="18" fill="none" stroke="#7ed9a4" stroke-width="3"/><circle cx="125" cy="115" r="18" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="85" y="160" fill="#7ed9a4" font-size="16" font-weight="700">5 · CROWD</text><text x="85" y="188" fill="#f7f2de" font-size="13">fact-check</text><text x="85" y="209" fill="#f7f2de" font-size="13">add missing pieces</text></g>
<rect x="165" y="465" width="870" height="100" rx="20" fill="none" stroke="#f7d56b" stroke-width="3"/><text x="600" y="503" text-anchor="middle" fill="#f7d56b" font-size="20" font-weight="700">SUBSCRIBERS GET VIDEOS, VISUALS, UPDATES AND EARLY DRAFTS</text><text x="600" y="533" text-anchor="middle" fill="#f7f2de" font-size="16">They can answer by email with context, corrections, taste and new ideas.</text><text x="600" y="596" text-anchor="middle" fill="#f4a7c1" font-size="18">The editorial crowd is not an audience after production — it is part of the production system.</text></g></svg>