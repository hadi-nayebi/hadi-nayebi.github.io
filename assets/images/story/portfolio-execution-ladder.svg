<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Execution moves outward, cognition moves upward</title><desc id="d">A chalkboard staircase from doing one task to designing methods, parallel cognition, comparing methods and creating new context, with a calculator analogy.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="27" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs><rect width="1200" height="680" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="34" font-weight="700">EXECUTION MOVES OUTWARD. COGNITION MOVES UPWARD.</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">The goal is not to do more. The goal is to think at a higher level.</text>
<path d="M70 550 H260 V465 H450 V380 H640 V295 H830 V210 H1040" fill="none" stroke="#f7e9b0" stroke-width="5"/>
<g font-size="17" font-weight="700"><circle cx="150" cy="505" r="28" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="150" y="512" text-anchor="middle" fill="#f2a45c">1</text><text x="80" y="585" fill="#f7f2de">DO ONE TASK</text><text x="80" y="609" fill="#aab0ba" font-size="14">execution-heavy</text>
<circle cx="345" cy="420" r="28" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="345" y="427" text-anchor="middle" fill="#7ed9a4">2</text><text x="275" y="500" fill="#f7f2de">DESIGN THE METHOD</text><text x="275" y="524" fill="#aab0ba" font-size="14">make the process explicit</text>
<circle cx="535" cy="335" r="28" fill="none" stroke="#d89cff" stroke-width="3"/><text x="535" y="342" text-anchor="middle" fill="#d89cff">3</text><text x="465" y="415" fill="#f7f2de">PARALLEL COGNITION</text><text x="465" y="439" fill="#aab0ba" font-size="14">run multiple lenses</text>
<circle cx="725" cy="250" r="28" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="725" y="257" text-anchor="middle" fill="#79d6ff">4</text><text x="655" y="330" fill="#f7f2de">COMPARE + IMPROVE</text><text x="655" y="354" fill="#aab0ba" font-size="14">design better methods</text>
<circle cx="915" cy="165" r="28" fill="none" stroke="#f4a7c1" stroke-width="3"/><text x="915" y="172" text-anchor="middle" fill="#f4a7c1">5</text><text x="835" y="245" fill="#f7f2de">CREATE NEW CONTEXT</text><text x="835" y="269" fill="#aab0ba" font-size="14">new questions become possible</text></g>
<g transform="translate(900 405)"><rect width="205" height="175" rx="20" fill="none" stroke="#f7d56b" stroke-width="3"/><text x="102" y="34" text-anchor="middle" fill="#f7d56b" font-size="17" font-weight="700">CALCULATOR ANALOGY</text><rect x="35" y="58" width="68" height="82" rx="9" fill="none" stroke="#f7f2de" stroke-width="3"/><g fill="#f7f2de"><circle cx="55" cy="80" r="4"/><circle cx="80" cy="80" r="4"/><circle cx="55" cy="103" r="4"/><circle cx="80" cy="103" r="4"/></g><text x="122" y="86" fill="#f7f2de" font-size="14">arithmetic</text><text x="122" y="110" fill="#aab0ba" font-size="13">moves outward</text><text x="122" y="137" fill="#7ed9a4" font-size="14">mathematics</text><text x="122" y="158" fill="#aab0ba" font-size="13">moves upward</text></g>
<text x="600" y="640" text-anchor="middle" fill="#f4a7c1" font-size="18">Offloading known execution gives the person more room to design, compare and invent.</text></g></svg>