<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">A shared office, many local agents</title><desc id="d">A chalkboard diagram showing several team members with their own local CLI agents connected to one shared private repository and dashboard, while personal context remains local.</desc><defs><filter id="c"><feTurbulence baseFrequency=".013" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs><rect width="1200" height="720" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="600" y="62" text-anchor="middle" fill="#f7f2de" font-size="35" font-weight="700">A SHARED OFFICE, MANY LOCAL AGENTS</text><text x="600" y="94" text-anchor="middle" fill="#8fd3ff" font-size="17">One team-owned substrate. Each member keeps their own working surface.</text>
<g fill="none" stroke-width="3"><circle cx="165" cy="205" r="30" stroke="#79d6ff"/><path d="M120 285 q45-48 90 0" stroke="#79d6ff"/><rect x="110" y="300" width="110" height="65" rx="8" stroke="#79d6ff"/><circle cx="165" cy="485" r="30" stroke="#f2a45c"/><path d="M120 565 q45-48 90 0" stroke="#f2a45c"/><rect x="110" y="580" width="110" height="65" rx="8" stroke="#f2a45c"/><circle cx="1035" cy="205" r="30" stroke="#7ed9a4"/><path d="M990 285 q45-48 90 0" stroke="#7ed9a4"/><rect x="980" y="300" width="110" height="65" rx="8" stroke="#7ed9a4"/><circle cx="1035" cy="485" r="30" stroke="#d89cff"/><path d="M990 565 q45-48 90 0" stroke="#d89cff"/><rect x="980" y="580" width="110" height="65" rx="8" stroke="#d89cff"/></g>
<g fill="#f7f2de" font-size="14" text-anchor="middle"><text x="165" y="395">Member A · local CLI</text><text x="165" y="675">Member B · local CLI</text><text x="1035" y="395">Member C · local CLI</text><text x="1035" y="675">Member D · local CLI</text></g>
<rect x="400" y="185" width="400" height="285" rx="26" fill="none" stroke="#f7d56b" stroke-width="4"/><text x="600" y="228" text-anchor="middle" fill="#f7d56b" font-size="23" font-weight="700">SHARED PRIVATE REPOSITORY</text><text x="600" y="260" text-anchor="middle" fill="#f7f2de" font-size="16">team context · jobs · plugins · rules · project state</text><rect x="475" y="300" width="250" height="105" rx="12" fill="none" stroke="#8fd3ff" stroke-width="3"/><text x="600" y="338" text-anchor="middle" fill="#8fd3ff" font-size="20" font-weight="700">TEAM DASHBOARD</text><text x="600" y="370" text-anchor="middle" fill="#f7f2de" font-size="15">jobs · questions · approvals · feedback</text>
<g stroke="#f4a7c1" stroke-width="3" stroke-dasharray="8 9" fill="none"><path d="M235 330 C320 315 350 295 400 285"/><path d="M235 610 C330 570 360 500 420 450"/><path d="M965 330 C880 315 850 295 800 285"/><path d="M965 610 C870 570 840 500 780 450"/></g>
<rect x="345" y="505" width="510" height="115" rx="20" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="600" y="540" text-anchor="middle" fill="#7ed9a4" font-size="18" font-weight="700">SHARED VS. PERSONAL</text><text x="600" y="573" text-anchor="middle" fill="#f7f2de" font-size="15">team cognition stays versioned in the center</text><text x="600" y="599" text-anchor="middle" fill="#f7f2de" font-size="15">personal notes, preferences and experiments can remain local</text>
<text x="600" y="675" text-anchor="middle" fill="#f4a7c1" font-size="18">The dashboard and the terminals are different doors into one shared team cortex.</text></g></svg>