<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Point your CLI agent at Hadosh Academy</title><desc id="d">A chalkboard diagram showing Codex, Claude Code, OpenCode, Qwen Code and other CLI agents learning from Hadosh Academy, then moving through learn, understand, build one behavior and grow your harness.</desc>
<defs><filter id="chalk"><feTurbulence baseFrequency=".012" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#f4e7b2" stroke-width="1.5"/></marker><pattern id="grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="13" cy="18" r="1" fill="#fff" opacity=".035"/><circle cx="62" cy="49" r=".8" fill="#fff" opacity=".025"/></pattern></defs>
<rect width="1200" height="720" rx="28" fill="#0a0d0f"/><rect width="1200" height="720" rx="28" fill="url(#grain)"/>
<g filter="url(#chalk)" font-family="Arial, sans-serif">
<text x="600" y="66" text-anchor="middle" fill="#f7f2de" font-size="36" font-weight="700">POINT YOUR CLI HERE</text>
<text x="600" y="98" text-anchor="middle" fill="#8fd3ff" font-size="17">Teach it the architecture. Learn with it. Build with it.</text>
<rect x="55" y="145" width="250" height="410" rx="20" fill="none" stroke="#79d6ff" stroke-width="3"/>
<text x="180" y="184" text-anchor="middle" fill="#79d6ff" font-size="19" font-weight="700">YOUR CLI AGENT</text>
<g fill="#f7f2de" font-size="18"><text x="92" y="232">› Codex</text><text x="92" y="277">› Claude Code</text><text x="92" y="322">› OpenCode</text><text x="92" y="367">› Qwen Code</text><text x="92" y="412">› another capable CLI</text></g>
<path d="M92 470 h145 m-145 30 h110" stroke="#7ed9cf" stroke-width="3" stroke-linecap="round"/><path d="M210 520 l20 15 l-20 15" fill="none" stroke="#7ed9cf" stroke-width="3"/>
<path d="M318 350 C365 350 390 350 430 350" fill="none" stroke="#f4e7b2" stroke-width="4" marker-end="url(#arr)"/>
<text x="372" y="330" text-anchor="middle" fill="#f4a7c1" font-size="15">point it here</text>
<path d="M470 205 l120-55 l120 55 v210 h-240z" fill="none" stroke="#bc9cff" stroke-width="4"/><path d="M500 245 h180 M500 285 h180 M500 325 h180" stroke="#bc9cff" stroke-width="2" opacity=".8"/>
<text x="590" y="240" text-anchor="middle" fill="#f7d56b" font-size="25" font-weight="700">HADOSH ACADEMY</text>
<g fill="#f7f2de" font-size="16" text-anchor="middle"><text x="590" y="277">technical writing</text><text x="590" y="309">design philosophy</text><text x="590" y="341">reference systems</text><text x="590" y="373">project pages</text></g>
<path d="M730 235 C790 200 820 185 865 180" fill="none" stroke="#f4e7b2" stroke-width="3" marker-end="url(#arr)"/><path d="M730 315 C790 315 820 315 865 315" fill="none" stroke="#f4e7b2" stroke-width="3" marker-end="url(#arr)"/><path d="M730 385 C790 420 820 435 865 440" fill="none" stroke="#f4e7b2" stroke-width="3" marker-end="url(#arr)"/>
<g font-size="20" font-weight="700"><circle cx="910" cy="175" r="34" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="910" y="182" text-anchor="middle" fill="#f2a45c">1</text><text x="960" y="182" fill="#f7f2de">LEARN</text><circle cx="910" cy="295" r="34" fill="none" stroke="#8fd3ff" stroke-width="3"/><text x="910" y="302" text-anchor="middle" fill="#8fd3ff">2</text><text x="960" y="302" fill="#f7f2de">UNDERSTAND</text><circle cx="910" cy="415" r="34" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="910" y="422" text-anchor="middle" fill="#7ed9a4">3</text><text x="960" y="422" fill="#f7f2de">BUILD ONE BEHAVIOR</text><circle cx="910" cy="535" r="34" fill="none" stroke="#d89cff" stroke-width="3"/><text x="910" y="542" text-anchor="middle" fill="#d89cff">4</text><text x="960" y="542" fill="#f7f2de">GROW YOUR HARNESS</text></g>
<path d="M910 210 v45 M910 330 v45 M910 450 v45" stroke="#f7f2de" stroke-width="2" stroke-dasharray="7 8"/>
<text x="600" y="660" text-anchor="middle" fill="#f4a7c1" font-size="20">Start with the agent you already have. The website becomes both curriculum and design context.</text>
</g></svg>