<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="t d"><title id="t">Crime Cartography and the crowd-owned data channel</title><desc id="d">A chalkboard diagram showing city data flowing into an AI production harness, then through a human editorial crowd into a YouTube data-visualization channel whose value can be shared by contributors and replicated by other collectives.</desc><defs><filter id="c"><feTurbulence baseFrequency=".012" numOctaves="2" seed="18" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#f7e9b0" stroke-width="1.5"/></marker></defs><rect width="1280" height="760" rx="28" fill="#0a0d0f"/><g filter="url(#c)" font-family="Arial,sans-serif"><text x="640" y="58" text-anchor="middle" fill="#f7f2de" font-size="35" font-weight="700">CRIME CARTOGRAPHY — AND BEYOND</text><text x="640" y="91" text-anchor="middle" fill="#8fd3ff" font-size="17">A crowd-owned city-data channel: the harness produces, people make it worth publishing.</text>
<g transform="translate(45 145)"><rect width="220" height="390" rx="22" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="110" y="40" text-anchor="middle" fill="#79d6ff" font-size="20" font-weight="700">CITY DATA</text><g fill="#f7f2de" font-size="15"><text x="30" y="88">• crime trends</text><text x="30" y="122">• heat maps</text><text x="30" y="156">• population</text><text x="30" y="190">• schools</text><text x="30" y="224">• libraries</text><text x="30" y="258">• churches</text><text x="30" y="292">• businesses</text><text x="30" y="326">• other city signals</text></g><path d="M35 355 q45-95 80 0 q35-55 70 0" fill="none" stroke="#7ed9a4" stroke-width="3"/></g>
<path d="M275 335 H330" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(340 145)"><rect width="240" height="390" rx="22" fill="none" stroke="#d89cff" stroke-width="3"/><text x="120" y="40" text-anchor="middle" fill="#d89cff" font-size="20" font-weight="700">PRODUCTION HARNESS</text><circle cx="120" cy="120" r="44" fill="none" stroke="#d89cff" stroke-width="3"/><path d="M90 118 h60 M120 88 v60" stroke="#d89cff" stroke-width="3"/><g fill="#f7f2de" font-size="15" text-anchor="middle"><text x="120" y="198">collect + compare data</text><text x="120" y="232">generate charts + maps</text><text x="120" y="266">draft script + narration</text><text x="120" y="300">assemble video + visuals</text><text x="120" y="334">prepare editorial questions</text></g><text x="120" y="370" text-anchor="middle" fill="#f4a7c1" font-size="15">repeatable 80% production</text></g>
<path d="M590 335 H645" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(655 145)"><rect width="250" height="390" rx="22" fill="none" stroke="#f2a45c" stroke-width="3"/><text x="125" y="40" text-anchor="middle" fill="#f2a45c" font-size="20" font-weight="700">HUMAN EDITORIAL CROWD</text><g fill="none" stroke="#f7f2de" stroke-width="2.5"><circle cx="60" cy="112" r="18"/><circle cx="110" cy="94" r="18"/><circle cx="160" cy="112" r="18"/><circle cx="205" cy="94" r="18"/></g><g fill="#f7f2de" font-size="15"><text x="30" y="175">• fact-check</text><text x="30" y="208">• add missing context</text><text x="30" y="241">• improve story / pacing</text><text x="30" y="274">• challenge weak framing</text><text x="30" y="307">• suggest new city questions</text><text x="30" y="340">• approve what earns release</text></g><text x="125" y="370" text-anchor="middle" fill="#7ed9a4" font-size="15">taste + judgment + accountability</text></g>
<path d="M915 335 H970" stroke="#f7e9b0" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(980 145)"><rect width="250" height="390" rx="22" fill="none" stroke="#7ed9a4" stroke-width="3"/><text x="125" y="40" text-anchor="middle" fill="#7ed9a4" font-size="20" font-weight="700">DATA-STORY CHANNEL</text><rect x="72" y="82" width="110" height="76" rx="15" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M112 103 l38 17 l-38 17z" fill="none" stroke="#f4a7c1" stroke-width="3"/><path d="M35 215 q50-80 95 0 q45-65 85 0" fill="none" stroke="#79d6ff" stroke-width="3"/><text x="125" y="250" text-anchor="middle" fill="#f7f2de" font-size="15">city-centered videos</text><text x="125" y="278" text-anchor="middle" fill="#f7f2de" font-size="15">visuals + updates by email</text><text x="125" y="306" text-anchor="middle" fill="#f7f2de" font-size="15">subscribers become contributors</text><text x="125" y="345" text-anchor="middle" fill="#f7d56b" font-size="16">value can flow back to the crowd</text></g>
<path d="M1100 550 C1100 630 920 655 640 655 C360 655 190 630 190 550" fill="none" stroke="#f7d56b" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#a)"/>
<rect x="360" y="575" width="560" height="105" rx="20" fill="none" stroke="#f7d56b" stroke-width="3"/><text x="640" y="612" text-anchor="middle" fill="#f7d56b" font-size="20" font-weight="700">A REPLICABLE COLLECTIVE MODEL</text><text x="640" y="640" text-anchor="middle" fill="#f7f2de" font-size="15">new groups can adopt the same harness + crowd pattern for other topics and build their own channels</text><text x="640" y="665" text-anchor="middle" fill="#f4a7c1" font-size="14">a possible decentralized gig economy: shared editorial work, shared ownership, shared value</text></g></svg>