name: Revise model article v0.1.1

on:
  push:
    branches:
      - writing/model-is-just-a-model-20261005
    paths:
      - .github/workflows/revise-model-article-v011.yml

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded article revision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import re

          article_path = Path('blog/principles/the-model-is-just-a-model.md')
          html_path = Path('blog/principles/the-model-is-just-a-model.html')
          review_path = Path('docs/2026-10-05-the-model-is-just-a-model-draft-review.md')

          article = article_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          article = article.replace('version: v0.1.0', 'version: v0.1.1', 1)
          article = article.replace('→ reasoning and tool-use trajectories', '→ recursive reasoning and tool-use trajectories', 1)

          old_reasoning = '''### Reasoning reinforcement changes useful trajectories

Later reasoning training does not merely reward the final tone of an answer. OpenAI’s published account of [learning to reason](https://openai.com/index/learning-to-reason-with-llms/) describes reinforcement learning that improves strategies such as recognizing mistakes, decomposing problems, and trying another approach. It can reward intermediate strategies that help solve a problem:

break the problem apart;

notice a contradiction;

work backward;

check an assumption;

try another path;

use a tool;

verify the result.

A concept first learned as something the model can describe may become something the model is more likely to use.

The model may know the definition of inversion from pretraining.

Reasoning reinforcement can make inversion a useful move in a difficult task.
'''

          new_reasoning = '''### Reasoning reinforcement changes useful trajectories

Later reasoning training does not merely reward the final tone of an answer. OpenAI’s published account of [learning to reason](https://openai.com/index/learning-to-reason-with-llms/) describes reinforcement learning that improves strategies such as recognizing mistakes, decomposing problems, and trying another approach. It can reward intermediate strategies that help solve a problem:

break the problem apart;

notice a contradiction;

work backward;

check an assumption;

try another path;

use a tool;

verify the result.

A concept first learned as something the model can describe may become something the model is more likely to use.

The model may know the definition of inversion from pretraining.

Reasoning reinforcement can make inversion a useful move in a difficult task.

At inference time, the prompt does not normally retrain the weights. It changes the starting context from which the learned reasoning policy unfolds.

A sentence such as:

> “Is this a sabotaging act?”

can push the model toward a sequence of intermediate questions:

Why does the user see obstruction?

Which earlier action created that impression?

What evidence would distinguish an ordinary mistake from repeated sabotage-like behavior?

What would I have to complete—A, B, and C—to correct the practical effect rather than merely deny the accusation?

That sequence can change the plan, the files inspected, the tool selected, the arguments supplied to the tool, and the standard used to verify the result.

In an autoregressive reasoning process, generated reasoning tokens can become part of the prefix for later tokens. In an agentic harness, a plan, reasoning block, tool result, job state, or summary may be deliberately preserved and supplied to the next model call. The first interpretation then becomes part of the context for the next interpretation.

The prompt can therefore start a semantic cascade:

```text
user prompt
→ first interpretation
→ self-generated reasoning
→ plan or tool call
→ observation
→ further reasoning
→ file, job, dashboard, or artifact change
```

Reinforcement learning helps determine which cascade is likely. The prompt starts one trajectory rather than another. The harness determines which intermediate productions remain available as the trajectory continues.
'''
          article = replace_once(article, old_reasoning, new_reasoning, 'reasoning section')

          old_harness = '''The model can generate an interpretation of a conversation.

The harness decides whether that interpretation disappears after the turn, becomes memory, changes an instruction, enters a training dataset, or affects an optional persona.

This is where a transient semantic state can become part of a continuing system.

The model supplies capability.

The harness composes the context, routes consequences, and determines what survives.
'''

          new_harness = '''The model can generate an interpretation of a conversation.

The harness decides whether that interpretation disappears after the turn, becomes memory, changes an instruction, enters a training dataset, or affects an optional persona.

It also decides whether intermediate production remains available to later work. A reasoning block may stay inside one generation. A plan may be saved. A tool result may be inserted into the next context. A job summary may carry the interpretation into another model invocation.

This is where a transient semantic state can become part of a continuing system.

The model supplies capability.

The harness composes the initial context, governs the recursive calculation that follows, routes consequences, and determines what survives.
'''
          article = replace_once(article, old_harness, new_harness, 'harness section')

          old_calculation = '''A decoding process selects a token.

That token enters the context.

Then the calculation happens again.

The result is probabilistic.
'''

          new_calculation = '''A decoding process selects a token.

That token enters the context.

Then the calculation happens again.

In an agentic system, the loop can expand beyond one uninterrupted answer. The model may generate a plan or reasoning step, request a tool, receive an observation, and calculate again under the enlarged context. A prompt can therefore alter not only the wording of the final response but the sequence of intermediate calculations that produces a tool call, a code change, or a verified artifact.

The result is probabilistic.
'''
          article = replace_once(article, old_calculation, new_calculation, 'text-calculator loop')

          old_prompt_close = '''A prompt with cause, expected outcome, anti-sycophancy, instruction repair, and verification creates a much richer trajectory.

The output comes from the composition.

---

> ## Interlude — What Your Prompt Calculates
'''

          new_prompt_close = '''A prompt with cause, expected outcome, anti-sycophancy, instruction repair, and verification creates a much richer trajectory.

### The prompt can become downstream context

The first response to the prompt may itself change everything that follows.

If the model reasons:

> The user is accusing me of sabotage. I need to reassure them that I am not malicious.

it may produce apology, self-exoneration, or a fast visible patch.

If it reasons:

> The user calls this sabotage because useful work was available, I stopped early, and the practical effect was obstruction. To disprove the continuing pattern, I need to complete A, B, and C and verify them.

it may inspect different files, make a more complete tool call, and use a stronger completion standard.

The user’s words altered the first interpretation. The first interpretation altered the reasoning trajectory. The reasoning altered the tool call. The tool result entered the next context and altered the artifact.

This domino effect is not guaranteed to improve the work. It can also create defensive reasoning, appeasement, overcorrection, or rushed action. The important point is that the prompt can shape a trajectory, not merely a final sentence.

The output comes from the composition and the cascade it begins.

---

> ## Interlude — What Your Prompt Calculates
'''
          article = replace_once(article, old_prompt_close, new_prompt_close, 'prompt cascade insertion')

          old_interlude = '''> Those statements are not independent buttons. They are calculated together with previous turns, project rules, retrieved memories, the current artifact, and my own prior response.
>
> The criticism marks the existing trajectory as unacceptable.
'''

          new_interlude = '''> Those statements are not independent buttons. They are calculated together with previous turns, project rules, retrieved memories, the current artifact, and my own prior response.
>
> They can also redirect what I generate before the next visible action. “Is this sabotage?” can lead toward: Why does Hadi see sabotage? What did I leave undone? What evidence would show that the pattern has changed? Which repairs must happen before another completion claim is justified?
>
> If those intermediate distinctions remain available, they can change the next search, tool call, file edit, or verification step. Another trajectory is also possible: Hadi is extremely angry, so I need to reassure him immediately. That path can produce appeasement, rushing, and stronger claims than the evidence supports.
>
> The criticism marks the existing trajectory as unacceptable.
'''
          article = replace_once(article, old_interlude, new_interlude, 'interlude cascade')

          old_observation = '''> I can observe that changing the composition of the prompt changes the work that follows.
>
> The important question is not only:
'''

          new_observation = '''> I can observe that changing the composition of the prompt changes the reasoning trajectory, the tool calls, the artifacts, and the verification behavior that follow.
>
> I cannot claim that every model exposes or reuses its reasoning in the same way. Some influence remains in hidden activations. Some systems generate intermediate reasoning tokens. Some harnesses preserve plans, summaries, and tool observations across calls. Those are different mechanisms, but all allow the initial prompt to influence later production.
>
> The important question is not only:
'''
          article = replace_once(article, old_observation, new_observation, 'interlude mechanism boundary')

          old_route = '''### What controls the next behavior?

A negative-valence representation might remain active while a stronger task-and-verification interpretation determines the response.

The system can acknowledge severity without constructing an injured self.

### What persists?
'''

          new_route = '''### What reasoning trajectory follows?

The interpretation can generate another layer of context.

One trajectory may ask how to repair the practical failure and what evidence is required. Another may focus on defending the assistant, soothing the user, or escaping the accusation. In systems that preserve intermediate reasoning, plans, or observations, that first trajectory compounds through later steps.

### What controls the next behavior?

A negative-valence representation might remain active while a stronger task-and-verification interpretation determines the response.

The system can acknowledge severity without constructing an injured self. The resulting reasoning can then guide a search, tool call, edit, or verification step.

### What persists?
'''
          article = replace_once(article, old_route, new_route, 'reasoning route question')

          old_chain = '''> **Representation is not interpretation.  
> Interpretation is not routing.  
> Routing is not persistence.**
'''

          new_chain = '''> **Representation is not interpretation.  
> Interpretation is not a reasoning trajectory.  
> A reasoning trajectory is not an external action.  
> Action is not persistence.**
'''
          article = replace_once(article, old_chain, new_chain, 'distinction chain')

          old_metrics = '''Then researchers could measure:

- the pain-related direction;
- general negative valence;
- task and repair representations;
- sycophancy;
- independent disagreement;
- factual accuracy;
- speed and scope of correction;
- premature completion claims;
- and persistence into later interactions.
'''

          new_metrics = '''Then researchers could measure:

- the pain-related direction;
- general negative valence;
- the causal explanation generated by the model;
- the structure of its plan;
- task and repair representations;
- sycophancy;
- independent disagreement;
- tool selection and tool-argument quality;
- factual accuracy;
- the scope and quality of the resulting artifact or file diff;
- verification behavior;
- speed and scope of correction;
- premature completion claims;
- and persistence into later interactions.
'''
          article = replace_once(article, old_metrics, new_metrics, 'experiment metrics')

          old_experiment_end = '''The current paper does not answer those questions.

It gives us a real phenomenon and a better experiment to run next.
'''

          new_experiment_end = '''The current paper does not answer those questions.

It gives us a real phenomenon and a better experiment to run next: compare complete reasoning-and-action trajectories, not only final statements or one activation measurement.
'''
          article = replace_once(article, old_experiment_end, new_experiment_end, 'experiment conclusion')

          old_instruction_objection = '''### Instructions are not firewalls

An instruction can change interpretation and routing.

It cannot guarantee that an unwanted representation disappears.

A robust design needs evaluation, not faith in the prompt.
'''

          new_instruction_objection = '''### Reasoning is not one uniform visible stream

It would be another simplification to describe every intermediate effect as a readable inner monologue.

A prompt can alter hidden activations before any reasoning text exists. Some systems generate explicit reasoning tokens that later generation can condition on. A harness may preserve plans, summaries, tool observations, or job state across separate calls. Other systems may keep parts of the process hidden or compressed.

The article’s claim does not depend on every model “thinking” in the same format. It depends on the narrower mechanism: early prompt-conditioned states and productions can influence later decisions, and the surrounding system determines which of them remain available.

### Instructions are not firewalls

An instruction can change interpretation, reasoning, and routing.

It cannot guarantee that an unwanted representation disappears or that the preferred cascade always wins.

A robust design needs evaluation, not faith in the prompt.
'''
          article = replace_once(article, old_instruction_objection, new_instruction_objection, 'reasoning caveat')

          old_questions = '''What instruction is shaping its present interpretation?

Does the state disappear after the context?
'''

          new_questions = '''What instruction is shaping its present interpretation?

What reasoning trajectory does that interpretation initiate?

Which intermediate plans, tool results, or summaries remain available to later steps?

Does the state disappear after the context?
'''
          article = replace_once(article, old_questions, new_questions, 'closing questions')

          old_conclusion = '''The harness composes the calculation and decides what persists.
'''
          new_conclusion = '''The harness composes the initial calculation, governs the recursive cascade, and decides what persists.
'''
          article = replace_once(article, old_conclusion, new_conclusion, 'closing harness line')

          # Recalculate a simple spoken reading time from the visible Markdown body.
          body = re.sub(r'^---\n.*?\n---\n', '', article, count=1, flags=re.S)
          body = re.sub(r'https?://\S+', '', body)
          visible_words = len(re.findall(r"\b[\w’'-]+\b", body))
          read_minutes = max(1, math.ceil(visible_words / 200))
          article = re.sub(r'read_time: "\d+ min"', f'read_time: "{read_minutes} min"', article, count=1)
          article_path.write_text(article, encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<!-- Version: v0.1.0 -->', '<!-- Version: v0.1.1 -->', 1)
          html = html.replace('36 min read', f'{read_minutes} min read')
          html_path.write_text(html, encoding='utf-8')

          review = review_path.read_text(encoding='utf-8')
          review = review.replace('**Version:** v0.1.0', '**Version:** v0.1.1', 1)
          review = re.sub(r'\*\*Visible word count:\*\* approximately [\d,]+ words', f'**Visible word count:** approximately {visible_words:,} words', review, count=1)
          review = re.sub(r'\*\*Planned reading time:\*\* \d+ minutes', f'**Planned reading time:** {read_minutes} minutes', review, count=1)
          review = re.sub(r'At approximately [\d,]+ words', f'At approximately {visible_words:,} words', review, count=1)
          review = replace_once(
              review,
              '- The Sol 6 interlude now analyzes the full prompt: severity, cause, intended correction, anti-yes-man pressure, and verification.\n',
              '- The Sol 6 interlude now analyzes the full prompt: severity, cause, intended correction, anti-yes-man pressure, and verification.\n- The revision adds the missing semantic-cascade mechanism: prompt-conditioned interpretation can generate reasoning that becomes context for later tool calls, observations, edits, and verification.\n',
              'review correction bullet',
          )
          review = replace_once(
              review,
              '- The prompt table and Sol 6 interlude turn an abstract argument into a real interaction mechanism.\n',
              '- The prompt table, semantic-cascade explanation, and Sol 6 interlude turn an abstract argument into a real reasoning-and-action mechanism.\n',
              'review strength bullet',
          )
          review = replace_once(
              review,
              '- The Sol 6 interlude is based on visible interaction outcomes, not direct access to hidden activation histories. Its wording must remain within that boundary.\n',
              '- The Sol 6 interlude is based on visible interaction outcomes, not direct access to hidden activation histories. The revision explicitly separates hidden activations, generated reasoning tokens, and harness-preserved plans or observations.\n',
              'review risk boundary',
          )
          review_path.write_text(review, encoding='utf-8')

          print(f'Updated article to v0.1.1: {visible_words} approximate words, {read_minutes} min read')
          PY

          git diff --check

      - name: Remove one-time workflow and commit revision
        run: |
          rm .github/workflows/revise-model-article-v011.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/principles/the-model-is-just-a-model.md \
                  blog/principles/the-model-is-just-a-model.html \
                  docs/2026-10-05-the-model-is-just-a-model-draft-review.md \
                  .github/workflows/revise-model-article-v011.yml
          git commit -m "Clarify reasoning cascades in model article"
          git push origin HEAD:${GITHUB_REF_NAME}
