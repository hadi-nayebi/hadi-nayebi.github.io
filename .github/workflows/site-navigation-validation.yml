name: Site navigation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public links, navigation, and contribution surfaces
        run: |
          node scripts/validate-site-navigation.mjs
          node scripts/validate-contribution-surfaces.mjs
          node scripts/validate-start-here-first-response.mjs
