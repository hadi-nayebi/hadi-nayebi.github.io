name: Decode Family Games raster proof

on:
  push:
    branches: [family-games-raster-proof]
    paths:
      - 'tmp-family-raster/READY'

permissions:
  contents: write

jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: family-games-raster-proof
          fetch-depth: 0
      - name: Reconstruct real PNG artwork
        run: |
          set -euo pipefail
          mkdir -p assets/images/story-raster
          cat tmp-family-raster/chunk.* | base64 -d > assets/images/story-raster/family-games-world-hero.png
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/images/story-raster/family-games-world-hero.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Not a PNG file'
          assert len(data) > 100000, 'PNG unexpectedly small'
          print('PNG OK:', len(data), 'bytes')
          PY
          rm -rf tmp-family-raster
      - name: Commit raster artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add real Family Games chalkboard artwork'
          git push origin HEAD:family-games-raster-proof
