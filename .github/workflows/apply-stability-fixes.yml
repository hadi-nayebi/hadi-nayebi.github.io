name: Apply stability fixes

on:
  push:
    branches: [site-stability-round-2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site-stability-round-2
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply mechanical fixes
        run: node scripts/apply-stability-fixes.mjs
      - name: Commit transformed HTML
        run: |
          if git diff --quiet; then
            echo "No mechanical fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' 'blog/**/*.html'
          git commit -m "Apply cross-site navigation fixes"
          git push origin HEAD:site-stability-round-2
