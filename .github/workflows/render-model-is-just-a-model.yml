name: Render model article draft

on:
  push:
    branches:
      - writing/model-is-just-a-model-20261005
    paths:
      - blog/principles/the-model-is-just-a-model.md
      - blog/principles/the-model-is-just-a-model.html
      - .github/workflows/render-model-is-just-a-model.yml

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render canonical Markdown into the page shell
        run: |
          python3 scripts/sync-blog-body-from-markdown.py \
            blog/principles/the-model-is-just-a-model.md \
            blog/principles/the-model-is-just-a-model.html \
            --allow-removed-figures
          git diff --check

      - name: Commit synchronized HTML
        run: |
          if git diff --quiet -- blog/principles/the-model-is-just-a-model.html; then
            echo "HTML already matches the canonical Markdown."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/principles/the-model-is-just-a-model.html
          git commit -m "Render The Model Is Just a Model HTML"
          git push origin HEAD:${GITHUB_REF_NAME}
