name: Responsive layout validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'about.html'
      - 'services.html'
      - 'blog/practical-guides/03-give-your-ai-work-a-private-github-home.html'
      - 'js/theme-manager.js'
      - 'blog/b5/05_4-job-core.html'
      - 'blog/observations/hadosh-through-mental-models/02-map-is-not-territory.html'
      - 'blog/principles/the-ai-that-grows-with-you.html'
      - 'agents.html'
      - 'agents/**'
      - 'start-here.html'
      - 'blog/practical-guides/02-audit-ai-harness-portability.html'
      - 'blog/b5/explore/claude-md-hierarchy.html'
      - 'css/**'
      - 'data/abstraction-library.json'
      - 'js/components.js'
      - 'scripts/render-abstraction-library.mjs'
      - 'scripts/validate-responsive-layout.mjs'
      - '.github/workflows/responsive-layout-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'about.html'
      - 'services.html'
      - 'blog/practical-guides/03-give-your-ai-work-a-private-github-home.html'
      - 'js/theme-manager.js'
      - 'blog/b5/05_4-job-core.html'
      - 'blog/observations/hadosh-through-mental-models/02-map-is-not-territory.html'
      - 'blog/principles/the-ai-that-grows-with-you.html'
      - 'agents.html'
      - 'agents/**'
      - 'start-here.html'
      - 'blog/practical-guides/02-audit-ai-harness-portability.html'
      - 'blog/b5/explore/claude-md-hierarchy.html'
      - 'css/**'
      - 'data/abstraction-library.json'
      - 'js/components.js'
      - 'scripts/render-abstraction-library.mjs'
      - 'scripts/validate-responsive-layout.mjs'
      - '.github/workflows/responsive-layout-validation.yml'

jobs:
  responsive-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser test runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/hadosh-site.log 2>&1 &
          echo $! > /tmp/hadosh-site.pid
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/agents.html > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/hadosh-site.log
          exit 1
      - name: Verify layout, interaction, contrast, and accessibility
        run: node scripts/validate-responsive-layout.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-screenshots
          path: artifacts/responsive-layout
          if-no-files-found: error
          retention-days: 14
      - name: Upload CLAUDE.md explorable screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-md-hierarchy-responsive-screenshots
          path: artifacts/responsive-layout/claude-md-hierarchy-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload changed-page screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-home
          path: artifacts/responsive-layout/home-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload About screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-about
          path: artifacts/responsive-layout/about-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Start Here screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-start-here
          path: artifacts/responsive-layout/start-here-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Essay 5.4 screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-job-core
          path: artifacts/responsive-layout/job-core-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Lens 2 screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-map-territory
          path: artifacts/responsive-layout/map-territory-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload principle essay screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-ai-that-grows
          path: artifacts/responsive-layout/ai-that-grows-with-you-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Guide 2 screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-ai-use-map
          path: artifacts/responsive-layout/ai-use-map-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Services screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-services
          path: artifacts/responsive-layout/services-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Guide 3 screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-review-private-github-home
          path: artifacts/responsive-layout/private-github-home-*.png
          if-no-files-found: error
          retention-days: 14
